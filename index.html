  if(c===0)return['בהיר','sun'];if(c===1)return['בהיר ברובו','sun'];if(c===2)return['מעונן חלקית','cloudsun'];
  if(c===3)return['מעונן','cloud'];if(c===45||c===48)return['ערפל','cloud'];
  if(c>=51&&c<=67)return['גשם','rain'];if(c>=71&&c<=77)return['שלג','rain'];
  if(c>=80&&c<=82)return['ממטרים','rain'];if(c>=95)return['סופת רעמים','rain'];return['—','cloud'];
}
function wsvg(kind){
  var s='viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"';
  if(kind==='sun')return '<svg '+s+'><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"/></svg>';
  if(kind==='cloudsun')return '<svg '+s+'><path d="M15.9 8.1A4 4 0 1 0 8.5 10"/><path d="M7 18a4 4 0 0 1 .5-7.97A5 5 0 0 1 17 11a3.5 3.5 0 0 1-.5 7H7z"/></svg>';
  if(kind==='rain')return '<svg '+s+'><path d="M16 13a4.5 4.5 0 0 0 .5-9A6 6 0 0 0 5 5.5 4 4 0 0 0 6 13h10z"/><path d="M8 16v4M12 16v4M16 16v4"/></svg>';
  return '<svg '+s+'><path d="M17.5 19a4.5 4.5 0 1 0 0-9 6 6 0 0 0-11.5 1.5A4 4 0 0 0 6 19h11.5z"/></svg>';
}

/* ====================== DAILY FIGURE (Wikipedia) ====================== */
(function(){
  var f=FIGURES[dayOfYear(new Date())%FIGURES.length];
  document.getElementById('figAvatar').textContent=f.initial;
  document.getElementById('figAvatar').className='flex size-20 shrink-0 items-center justify-center overflow-hidden rounded-2xl bg-gradient-to-br '+f.grad+' text-4xl font-black text-white shadow-lg';
  document.getElementById('figName').textContent=f.name;
  document.getElementById('figField').textContent=f.field;
  document.getElementById('figYears').textContent=f.years;
  document.getElementById('figBio').textContent=f.bio;
  document.getElementById('figFacts').innerHTML=
    '<li class="rounded-full bg-violet-600 px-2.5 py-0.5 text-[11px] font-extrabold text-white">הידעת?</li>'+
    f.facts.map(function(x){return '<li class="rounded-full bg-violet-100 px-2.5 py-0.5 text-[11px] font-medium text-violet-800">'+x+'</li>';}).join('');
  if(f.quote){var q=document.getElementById('figQuote');q.textContent='״'+f.quote+'״';q.classList.remove('hidden');}
  // live Wikipedia extract + portrait
  var url='https://he.wikipedia.org/w/api.php?action=query&prop=extracts|pageimages&exintro&explaintext&piprop=thumbnail&pithumbsize=400&redirects=1&format=json&origin=*&titles='+encodeURIComponent(f.wiki);
  fetch(url).then(function(r){return r.json()}).then(function(d){
    var pages=d&&d.query&&d.query.pages;if(!pages)return;var p=pages[Object.keys(pages)[0]]||{};
    if(p.extract){
      var ex=p.extract.trim();
      if(ex.length>900){
        var cut=ex.slice(0,900);
        var lastDot=cut.lastIndexOf('. ');
        ex = lastDot>500 ? cut.slice(0,lastDot+1) : cut.replace(/\s+\S*$/,'')+'…';
      }
      document.getElementById('figBio').textContent=ex;
    }
    if(p.thumbnail&&p.thumbnail.source){
      var a=document.getElementById('figAvatar');a.textContent='';
      a.innerHTML='<img src="'+p.thumbnail.source+'" referrerpolicy="no-referrer" class="size-full object-cover" alt="">';
    }
  }).catch(function(){});
})();

/* ====================== NEWS TICKER (client-side via CORS proxy) ====================== */
(function(){
  var ticker=document.getElementById('ticker');
  function badge(t,cls){return '<span class="rounded-full px-2 py-0.5 text-[11px] font-extrabold '+cls+'">'+t+'</span>';}
  function render(titles){
    if(!titles.length)return;
    var loop=titles.concat(titles);
    ticker.innerHTML=loop.map(function(t){
      return '<span class="flex items-center gap-2 text-sm font-semibold" dir="rtl"><span class="size-1.5 shrink-0 rounded-full bg-white/70"></span><span class="text-white/95">'+t+'</span><span class="px-2 text-white/40">•</span></span>';
    }).join('');
    requestAnimationFrame(function(){
      var one=ticker.scrollWidth/2;ticker.style.animationDuration=Math.max(60,Math.round(one/20))+'s';
    });
  }
  function fetchTitles(feed,n){
    var u='https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent(feed);
    return fetch(u).then(function(r){return r.json()}).then(function(d){
      if(!d||d.status!=='ok'||!d.items)return[];
      return d.items.slice(0,n).map(function(it){return (it.title||'').trim()}).filter(Boolean);
    }).catch(function(){return[]});
  }
  function loadNews(){
    fetchTitles('https://www.ynet.co.il/Integration/StoryRss2.xml',14).then(function(titles){
      if(titles.length)render(titles);
    });
  }
  render(['מתעדכן…']);
  loadNews();
  setInterval(loadNews,600000);
})();

/* ====================== MUSIC (YouTube hotel/lounge) ====================== */
(function(){
  var sel=document.getElementById('musicSel');
  MUSIC.forEach(function(t){var o=document.createElement('option');o.value=t.id;o.textContent=t.name;sel.appendChild(o);});
  var saved=localStorage.getItem('vaad-music')||MUSIC[0].id;sel.value=saved;
  var player=null,ready=false,playing=false;
  var btn=document.getElementById('musicBtn'),pi=document.getElementById('playIcon'),pa=document.getElementById('pauseIcon');
  function setIcon(){pi.classList.toggle('hidden',playing);pa.classList.toggle('hidden',!playing);}
  window.onYouTubeIframeAPIReady=function(){
    player=new YT.Player('yt-player',{height:'150',width:'240',videoId:saved,
      playerVars:{autoplay:0,controls:0,disablekb:1,rel:0,modestbranding:1,playsinline:1},
      events:{onReady:function(e){e.target.setVolume(55);ready=true;},
        onStateChange:function(e){playing=(e.data===YT.PlayerState.PLAYING);setIcon();}}});
  };
  var tag=document.createElement('script');tag.src='https://www.youtube.com/iframe_api';document.body.appendChild(tag);
  btn.onclick=function(){if(!ready||!player)return;if(playing)player.pauseVideo();else player.playVideo();};
  sel.onchange=function(){localStorage.setItem('vaad-music',sel.value);if(player)player.loadVideoById(sel.value);};
})();
</script>
