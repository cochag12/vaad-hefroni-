<style>
  html,body{height:100%}
  body{
    font-family:'Heebo',system-ui,sans-serif;color:#e2e8f0;background-color:#020410;
    background-image:
      radial-gradient(1100px 700px at 110% -10%, rgba(34,211,238,.09), transparent 60%),
      radial-gradient(1000px 700px at -10% 110%, rgba(99,102,241,.11), transparent 55%),
      radial-gradient(900px 600px at 50% 50%, rgba(56,189,248,.04), transparent 70%);
    background-attachment:fixed;
  }
  /* פאנל זכוכית הולוגרפי - אופקיות גבוהה (נראה תקין גם בטלוויזיות במצב Vivid) */
  .panel{
    background: linear-gradient(180deg, rgba(10,16,39,.92), rgba(5,8,24,.92));
    backdrop-filter: blur(14px) saturate(120%);
    -webkit-backdrop-filter: blur(14px) saturate(120%);
    border: 1px solid rgba(34,211,238,.22);
    box-shadow:
      0 0 20px -8px rgba(34,211,238,.25),
      inset 0 0 0 1px rgba(34,211,238,.04),
      inset 0 1px 0 rgba(255,255,255,.04);
  }
  .panel-strong{ border-color: rgba(34,211,238,.35); box-shadow: 0 0 24px -8px rgba(34,211,238,.35), inset 0 0 0 1px rgba(34,211,238,.08); }
  .glow-cyan{ box-shadow: 0 0 8px rgba(34,211,238,.55), 0 0 18px rgba(34,211,238,.25); }
  .text-glow{ text-shadow: 0 0 6px rgba(34,211,238,.35); }
  .title-grad{
    background: linear-gradient(180deg,#ffffff 0%, #c7d2fe 55%, #818cf8 100%);

    filter: drop-shadow(0 0 10px rgba(129,140,248,.35));
  }
  .glass{background:rgba(15,23,42,.55);backdrop-filter:blur(12px) saturate(140%);-webkit-backdrop-filter:blur(12px) saturate(140%);border:1px solid rgba(34,211,238,.2)}
  @keyframes gradient-pan{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
  .gradient-pan{background-size:220% 220%;animation:gradient-pan 9s ease infinite}
  @keyframes float-slow{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  .float-slow{animation:float-slow 5s ease-in-out infinite}
  @keyframes marquee-x{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  .marquee-x{animation:marquee-x linear infinite}
  @keyframes scroll-up{from{transform:translateY(0)}to{transform:translateY(-50%)}}
  .scroll-up{animation:scroll-up linear infinite}
  @keyframes pulse-cyan{0%,100%{box-shadow:0 0 8px rgba(34,211,238,.6), 0 0 16px rgba(34,211,238,.3)}50%{box-shadow:0 0 14px rgba(34,211,238,.95), 0 0 32px rgba(34,211,238,.55)}}
  .pulse-cyan{animation:pulse-cyan 2.4s ease-in-out infinite}
  /* 🚨 אזעקה - צבע אדום: רקע פועם וחזק */
  @keyframes alert-pulse{0%,100%{background:rgba(220,38,38,0.97);box-shadow:inset 0 0 200px rgba(255,255,255,.15)}50%{background:rgba(153,27,27,0.97);box-shadow:inset 0 0 280px rgba(255,255,255,.25)}}
  .alert-pulse{animation:alert-pulse 0.85s ease-in-out infinite}
  @keyframes alert-text-blink{0%,100%{opacity:1;text-shadow:0 0 24px rgba(255,255,255,.95)}50%{opacity:.78;text-shadow:0 0 60px rgba(255,255,255,1)}}
  .alert-text-blink{animation:alert-text-blink 0.7s ease-in-out infinite}
  @keyframes circuit-shimmer{0%{opacity:.35}50%{opacity:.7}100%{opacity:.35}}
  .circuit-shimmer{animation:circuit-shimmer 6s ease-in-out infinite}
  .no-scrollbar::-webkit-scrollbar{display:none}
  .clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .clamp-bio{display:-webkit-box;-webkit-line-clamp:7;-webkit-box-orient:vertical;overflow:hidden}
  /* דפוס מעגלי-סייבר עדין לפינות */
  .cyber-corner::before, .cyber-corner::after{
    content:''; position:absolute; width:90px; height:90px; pointer-events:none;
    background-image:
      linear-gradient(rgba(34,211,238,.55), rgba(34,211,238,.55)),
      linear-gradient(rgba(34,211,238,.55), rgba(34,211,238,.55));
    background-repeat:no-repeat; background-size: 1px 60%, 60% 1px;
  }
  .cyber-corner::before{ top:-1px; right:-1px; background-position: right top, right top; }
  .cyber-corner::after { bottom:-1px; left:-1px; background-position: left bottom, left bottom; }
  @media (prefers-reduced-motion: reduce){.gradient-pan,.float-slow,.marquee-x,.scroll-up,.pulse-cyan,.circuit-shimmer,.bio-autoscroll{animation:none}}
  /* פאנל הביוגרפיה — אין פס גלילה ויזואלי (זה מסך תצוגה ללא אינטראקציה) */
  .figBio-wrap::-webkit-scrollbar{display:none}
  .figBio-wrap{scrollbar-width:none}
  /* כללי הבית — fade בין כללים מתחלפים */
  .rule-display{ transition: opacity .7s ease-in-out, transform .7s ease-in-out; opacity:1; transform: translateY(0); }
  .rule-display.fading{ opacity:0; transform: translateY(8px); }
  /* מצב לילה — עמעום של המסך בין 01:00 ל-05:00 (חיסכון בLED + עין נעימה בלילה).
     מוחל רק על #appRoot — כך שאם קופצת אזעקת צבע אדום, ה-overlay (שנוסף ישירות ל-body)
     נשאר בבהירות מלאה. */
  #appRoot{ transition: filter 8s ease-in-out, opacity 8s ease-in-out; }
  body.night-mode #appRoot{ filter: brightness(0.35) saturate(0.85); }
  /* גלילה אוטומטית של הביוגרפיה (פינג-פונג עם השהיות בקצוות) */
  @keyframes bio-pingpong{
    0%   { transform: translateY(0); }
    12%  { transform: translateY(0); }
    50%  { transform: translateY(var(--bio-max, 0px)); }
    62%  { transform: translateY(var(--bio-max, 0px)); }
    100% { transform: translateY(0); }
  }
  .bio-autoscroll{ animation: bio-pingpong linear infinite; }
</style>

<script>
/* ====================== DATA ====================== */

/* ----- בית: כללי התנהגות — מבוסס תקנון "כללי התנהגות עפרוני 18" + כללים כלליים ----- */
var HOUSE_RULES = [
  /* שעות מנוחה ורעש */
  "שעות מנוחה: 14:00–16:00 ו-22:00–07:00 — נא להימנע מרעש.",
  "אירועים ומסיבות — להודיע מראש לשכנים ולסיים עד 23:00.",
  "עבודות שיפוץ — בתיאום מראש עם הוועד ובשעות המותרות בלבד.",

  /* חניה */
  "חניה רק במקומות המוקצים; לא לחסום שכנים או יציאות חירום.",
  "אורחים יחנו מחוץ למתחם החניה — או רק בחניה הפרטית של הדייר המארח.",
  "לחנות בין הקווים המסומנים, לא עליהם — לאפשר כניסה ויציאה נוחה לשכנים.",
  "אין להשאיר באזורי החניה פסולת — קופסאות, ריהוט, בדלי סיגריות וכד׳.",
  "נהיגה במשנה זהירות בחניונים, במיוחד ביציאה מהחניון התחתון לעליון.",
  "עמדת טעינה לרכב חשמלי — רק לאחר אישור בכתב מהוועד; בעל הדירה נושא בעלויות.",

  /* שטחים משותפים — לובי, חדרי מדרגות, חצר */
  "שמירה על ניקיון המעלית, הלובי והחצר המשותפת.",
  "אין להשאיר חפצים, עגלות, אופניים או נעליים בחדר המדרגות — זו דרך מילוט.",
  "חפץ שיישאר בשטחים הציבוריים מעל 7 ימים מהתראה — ייפונה ע״י הוועד.",
  "ילדים — לא משחקי כדור או משחקים רועשים בשטחים הציבוריים.",
  "נא להקפיד שדלתות הכניסה (קדמית ואחורית) סגורות — למניעת כניסת זרים.",
  "אופניים וקורקינטים בעמדה הייעודית — לא בחדר המדרגות.",
  "אסור לעשן בכל השטחים המשותפים: לובי, מעלית, מסדרון וחניונים תת-קרקעיים.",
  "אין להיכנס לחדרי מתקנים (גנרטור, דוודים וכד׳) ללא ליווי מנהל הבית.",

function wcode(c){
  if(c===0)return['בהיר','sun'];if(c===1)return['בהיר ברובו','sun'];if(c===2)return['מעונן חלקית','cloudsun'];
  if(c===3)return['מעונן','cloud'];if(c===45||c===48)return['ערפל','cloud'];
  if(c>=51&&c<=67)return['גשם','rain'];if(c>=71&&c<=77)return['שלג','rain'];
  if(c>=80&&c<=82)return['ממטרים','rain'];if(c>=95)return['סופת רעמים','rain'];return['—','cloud'];

// === שמש בסגנון "מלון בוטיק" — דיסקית עם 32 שיני קרניים זיגזג, גרדיאנט פנימי ===
function sunburstPath(cx, cy, outerR, innerR, spikes){
  var pts = '';
  for (var i = 0; i < spikes * 2; i++){
    var ang = (i / (spikes * 2)) * Math.PI * 2 - Math.PI / 2;
    var r = (i % 2 === 0) ? outerR : innerR;
    var x = (cx + r * Math.cos(ang)).toFixed(2);
    var y = (cy + r * Math.sin(ang)).toFixed(2);
    pts += (i === 0 ? 'M' : 'L') + x + ' ' + y + ' ';
  }
  return pts + 'Z';
}

  if(kind==='sun'){

      '<path d="'+p+'" fill="url(#sgs)"/>'+
      '<path d="M7 18a4 4 0 0 1 .5-7.97A5 5 0 0 1 17 11a3.5 3.5 0 0 1-.5 7H7z" fill="#E5E7EB" stroke="#94A3B8" stroke-width="0.8"/>'+
    '</svg>';
  }
  if(kind==='rain'){
    return '<svg '+vb+'>'+
      '<path d="M16 13a4.5 4.5 0 0 0 .5-9A6 6 0 0 0 5 5.5 4 4 0 0 0 6 13h10z" fill="#94A3B8" stroke="#64748B" stroke-width="0.8"/>'+
      '<g fill="#60A5FA">'+

}

/* ===== המרה לגימטריה — תאריך עברי מסורתי (ט״ז סיון תשפ״ו) ===== */
function gematria(num){
  // מקרים מיוחדים — 15/16 כדי לא ליצור צירופי שם השם.
  if(num===15) return 'ט״ו';
  if(num===16) return 'ט״ז';
  var letters=[[400,'ת'],[300,'ש'],[200,'ר'],[100,'ק'],
               [90,'צ'],[80,'פ'],[70,'ע'],[60,'ס'],[50,'נ'],[40,'מ'],[30,'ל'],[20,'כ'],
               [10,'י'],[9,'ט'],[8,'ח'],[7,'ז'],[6,'ו'],[5,'ה'],[4,'ד'],[3,'ג'],[2,'ב'],[1,'א']];
  var result='';
  for(var i=0;i<letters.length;i++){
    while(num>=letters[i][0]){ result+=letters[i][1]; num-=letters[i][0]; }
  }
  if(result.length===1) return result + '׳';                      // גרש על אות בודדת
  return result.slice(0,-1) + '״' + result.slice(-1);             // גרשיים לפני האות האחרונה
}
function hebrewDate(d){
  try{
    // יום ושנה — מספרים שננציג בגימטריה
    var parts = new Intl.DateTimeFormat('en-u-ca-hebrew', {day:'numeric', year:'numeric'}).formatToParts(d);
    var day=0, year=0;
    parts.forEach(function(p){
      if(p.type==='day')  day  = parseInt(p.value,10);
      if(p.type==='year') year = parseInt(p.value,10);
    });
    // שם החודש בעברית — מהפורמטר הישראלי. מסיר את ה-ב' (כי "ב + חודש" זה צורת התאריך באמירה).
    var heParts = new Intl.DateTimeFormat('he-IL-u-ca-hebrew', {month:'long'}).formatToParts(d);
    var heMonth = '';
    heParts.forEach(function(p){ if(p.type==='month') heMonth = p.value; });
    heMonth = heMonth.replace(/^ב/,'').replace(/סיוון/,'סיון').replace(/חשוון/,'חשון');
    return gematria(day) + ' ' + heMonth + ' ' + gematria(year % 1000);
  } catch(e){ return ''; }
}

function updateNightMode(d){
  var h = d.getHours();
  var isNight = h >= 1 && h < 5;
  document.body.classList.toggle('night-mode', isNight);
}

function tickClock(){
  var n=new Date();
  document.getElementById('clock').textContent=n.toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  var gregorian = n.toLocaleDateString('he-IL',{weekday:'long',day:'2-digit',month:'2-digit',year:'numeric'});
  var hebrew = hebrewDate(n);
  document.getElementById('date').textContent = hebrew ? (gregorian + ' · ' + hebrew) : gregorian;
  updateNightMode(n);
}

/* ====================== SELECTED HEADLINES — עמוד של 3 כותרות מתחלף כל 5 שניות ====================== */
(function(){
  var pageEl = document.getElementById('headlinePage');
  if(!pageEl) return;
  var SOURCES=[
    {name:'וואלה',    badge:'bg-rose-400 text-rose-950',     url:'https://rss.walla.co.il/feed/1', take:4},
    {name:'ספורט',    badge:'bg-emerald-400 text-emerald-950',url:'https://www.ynet.co.il/Integration/StoryRss3.xml', take:4},
    {name:'גלובס',    badge:'bg-amber-300 text-amber-950',   url:'https://www.globes.co.il/webservice/rss/rssfeeder.asmx/FeederNode?iID=585', take:4},
  ];
  var items = [];
  var pageIdx = 0;
  var PAGE_SIZE = 3;
  var SWITCH_MS = 15000; // החלפת עמוד כל 15 שניות
  var FADE_MS   = 700;

  function pages(){ return Math.ceil(items.length / PAGE_SIZE) || 1; }

  function renderPage(){
    var start = pageIdx * PAGE_SIZE;
    var slice = items.slice(start, start + PAGE_SIZE);
    pageEl.innerHTML = slice.map(function(it){
      return '<div class="flex items-start gap-2 rounded-xl border border-brand-400/15 bg-brand-400/5 px-2 py-1.5">'+
        '<span class="shrink-0 rounded-full '+it.badge+' px-1.5 py-0.5 text-[10px] font-extrabold">'+it.source+'</span>'+
        '<span class="text-[12px] font-medium leading-snug text-slate-100">'+it.title+'</span>'+
      '</div>';
    }).join('');
  }
  function showNextPage(){
    if(!items.length) return;
    pageEl.classList.add('fading');
    setTimeout(function(){
      pageIdx = (pageIdx + 1) % pages();
      renderPage();
      pageEl.classList.remove('fading');
    }, FADE_MS);
  }

  function fetchFeed(src){
    return fetch('https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent(src.url))
      .then(function(r){return r.json()})
      .then(function(d){
        if(!d||d.status!=='ok'||!d.items) return [];
        return d.items.slice(0,src.take).map(function(it){
          return { source:src.name, badge:src.badge, title:(it.title||'').trim() };
        }).filter(function(x){return x.title;});
      })
      .catch(function(){return [];});
  }
  function load(){
    Promise.all(SOURCES.map(fetchFeed)).then(function(arrs){
      var mixed=[]; var max=Math.max.apply(null, arrs.map(function(a){return a.length;}));
      for(var i=0;i<max;i++){ arrs.forEach(function(a){ if(a[i]) mixed.push(a[i]); }); }
      if(mixed.length){
        items = mixed;
        if(pageIdx >= pages()) pageIdx = 0;
        renderPage();
      }
    });
  }
  load();
  setInterval(load, 20*60*1000);       // ריענון תוכן כל 20 דקות
  setInterval(showNextPage, SWITCH_MS); // החלפת עמוד כל 5 שניות
})();

(function(){
  // שומרים את ה-HTML המקורי של פאנל הדמות כדי להחזיר אותו אחרי השבת.
  var figSection = document.getElementById('figName').closest('section');
  var figOriginalHTML = figSection.innerHTML;

  // === גלילה אוטומטית של הביוגרפיה (כמו בכותרות הנבחרות) ===
  // אם הטקסט נכנס בקופסה — אין אנימציה. אם ארוך — פינג-פונג: גלילה למטה, השהיה, חזרה למעלה.
  // קצב יעד ~14 px/s (קצת איטי יותר מ"כותרות נבחרות" כדי שיהיה נוח לקריאה ארוכה).
  function setupBioAutoScroll(){
    var bio = document.getElementById('figBio');
    var wrap = bio && bio.parentElement;
    if(!bio || !wrap) return;
    // איפוס לפני חישוב מחדש
    bio.classList.remove('bio-autoscroll');
    bio.style.removeProperty('--bio-max');
    bio.style.removeProperty('animation-duration');
    // נחכה לפריסה לפני שמודדים
    requestAnimationFrame(function(){
      var overflow = bio.scrollHeight - wrap.clientHeight;
      if(overflow <= 4) return; // נכנס בלי גלילה
      // משך הסיבוב: 40% למטה + 20% השהיה + 40% למעלה. אם 40% = overflow/14 שניות,
      // אז סיבוב מלא = overflow/(14*0.4) ≈ overflow/5.6. מינימום 28 שניות.
      var dur = Math.max(28, Math.round(overflow / 5.6));
      bio.style.setProperty('--bio-max', '-'+overflow+'px');
      bio.style.animationDuration = dur + 's';
      bio.classList.add('bio-autoscroll');
    });
  }
  // חשיפה גלובלית — שגם עדכון ויקיפדיה האסינכרוני יוכל להפעיל מחדש
  window.vaadSetupBioAutoScroll = setupBioAutoScroll;
  function pickFigure(){

        '<div class="mt-1 max-w-xl text-[10px] sm:text-[11px] text-slate-400/70 leading-relaxed px-2">⚠️ זו תוספת — לא תחליף לרדיו (קול ברמה, קול חי, גלי ישראל) או לפורטל החירום</div>'+
        '<div class="mt-3 sm:mt-4 grid grid-cols-2 gap-4 sm:gap-8 text-center">'+
          '<div><div class="text-[10px] sm:text-xs text-brand-300/70">כניסת שבת</div><div class="text-xl sm:text-2xl font-black text-brand-200 text-glow tabular-nums">'+c+'</div></div>'+

        '</div>'+
      '</div>';
  }
  function isSilentNow(){ return !!figSection.querySelector('[data-silent="1"]'); }
  function restoreFigureHTML(){ if(isSilentNow()) figSection.innerHTML = figOriginalHTML; }
  function showFigure(){
    // בזמן השבת — מציגים "הגל השקט" במקום הדמות, ועוצרים את המוזיקה.
    if(window.vaadIsShabbatNow && window.vaadIsShabbatNow()){

    setupBioAutoScroll();

      '<li class="glow-cyan rounded-full bg-brand-400 px-2.5 py-0.5 text-[11px] font-extrabold text-night-900">הידעת?</li>'+
      f.facts.map(function(x){return '<li class="rounded-full border border-brand-400/30 bg-brand-400/10 px-2.5 py-0.5 text-[11px] font-medium text-brand-100">'+x+'</li>';}).join('');
    var q=document.getElementById('figQuote');
    if(f.quote){q.textContent='״'+f.quote+'״';q.classList.remove('hidden');} else {q.classList.add('hidden');}
    // explaintext=טקסט נקי. exchars=2000 מבטיח טקסט עשיר גם לדמויות שהפתיחה שלהן בויקיפדיה קצרה
    // (כמו רמב״ן — exintro לבד היה מחזיר 139 תווים בלבד).
    var url='https://he.wikipedia.org/w/api.php?action=query&prop=extracts|pageimages&exchars=2000&explaintext&piprop=thumbnail&pithumbsize=400&redirects=1&format=json&origin=*&titles='+encodeURIComponent(f.wiki);
    fetch(url).then(function(r){return r.json()}).then(function(d){
      var pages=d&&d.query&&d.query.pages;if(!pages)return;var p=pages[Object.keys(pages)[0]]||{};
      if(p.extract){
        var ex=p.extract.trim();
        if(ex.length>900){
          var cut=ex.slice(0,900);
          var lastDot=cut.lastIndexOf('. ');
          ex = lastDot>500 ? cut.slice(0,lastDot+1) : cut.replace(/\s+\S*$/,'')+'…';
        }
        var bio=document.getElementById('figBio'); if(bio){ bio.textContent=ex; setupBioAutoScroll(); }
      }
      if(p.thumbnail&&p.thumbnail.source){
        var a=document.getElementById('figAvatar'); if(!a) return;
        a.textContent=''; a.innerHTML='<img src="'+p.thumbnail.source+'" referrerpolicy="no-referrer" class="size-full object-cover" alt="">';
      }
    }).catch(function(){});
  }
  // חשיפה גלובלית כדי שה-Hebcal fetch יוכל לרענן מיד כשמגיעים זמני שבת.
  window.vaadRefreshFigure = showFigure;
  showFigure();
  // בדיקה דקתית: אם נכנסת/יצאת מהשבת — מחליפים את הפאנל.
  setInterval(function(){
    var silent = isSilentNow();
    var shouldBeSilent = !!(window.vaadIsShabbatNow && window.vaadIsShabbatNow());
    if(silent !== shouldBeSilent) showFigure();
  }, 60000);
  // החלפה אוטומטית ב-00:00 (לפי שעון המחשב), ואז כל יום.
  (function scheduleMidnight(){
    var now=new Date();
    var next=new Date(now.getFullYear(),now.getMonth(),now.getDate()+1,0,0,2);
    setTimeout(function(){
      showFigure();
      setInterval(showFigure, 24*60*60*1000);
    }, next-now);
  })();
})();

(function(){

  function badge(t,cls){return '<span class="rounded-full px-2 py-0.5 text-[11px] font-extrabold '+cls+'">'+t+'</span>';}
  function render(titles){
    if(!titles.length)return;
    var loop=titles.concat(titles);
    ticker.innerHTML=loop.map(function(t){
      return '<span class="flex items-center gap-2.5 text-base font-semibold" dir="rtl"><span class="size-2 shrink-0 rounded-full bg-brand-400 glow-cyan"></span><span class="text-slate-100">'+t+'</span><span class="px-2 text-brand-400/50">•</span></span>';
    }).join('');
    requestAnimationFrame(function(){
      var one=ticker.scrollWidth/2;ticker.style.animationDuration=Math.max(30,Math.round(one/40))+'s';
    });
  }
  function fetchTitles(feed,n){
    var u='https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent(feed);
    return fetch(u).then(function(r){return r.json()}).then(function(d){
      if(!d||d.status!=='ok'||!d.items)return[];
      return d.items.slice(0,n).map(function(it){return (it.title||'').trim()}).filter(Boolean);
    }).catch(function(){return[]});

      if(titles.length)render(titles);
    });

  loadNews();
  setInterval(loadNews,600000);
})();

/* ====================== MUSIC (קבצי MP3 מקומיים — אפס צריכת נתונים) ====================== */
/* HTML5 <audio> מנגן בלולאה אינסופית. ברירת מחדל: מנגן אוטומטית.
   נעצר רק אם המשתמש לחץ Pause במפורש, או ביום כיפור (אוטומטי).
   ב-kiosk.bat יש פלאג --autoplay-policy=no-user-gesture-required כדי לעקוף חסימת autoplay. */
(function(){
  var sel = document.getElementById('musicSel');
  var audio = document.getElementById('bgAudio');
  var btn = document.getElementById('musicBtn');
  var pi = document.getElementById('playIcon');
  var pa = document.getElementById('pauseIcon');
  // אם יש רק קובץ אחד — מסתירים את ה-select
  if(MUSIC.length <= 1){ sel.style.display = 'none'; } else { sel.style.display = ''; }
  MUSIC.forEach(function(t){ var o=document.createElement('option'); o.value=t.file; o.textContent=t.name; sel.appendChild(o); });
  var saved = localStorage.getItem('vaad-music') || MUSIC[0].file;
  if(!MUSIC.some(function(m){return m.file===saved;})){ saved = MUSIC[0].file; }
  sel.value = saved;
  audio.src = saved;
  audio.volume = 0.55;
  var playing = false;
  function setIcon(){ pi.classList.toggle('hidden', playing); pa.classList.toggle('hidden', !playing); }
  // userWants: האם המשתמש מעוניין במוזיקה? null = לא הוגדר עדיין (ברירת מחדל = כן, מנגן).
  function userWantsMusic(){ return localStorage.getItem('vaad-music-wants') !== '0'; }
  // ניסיון ניגון "שקט": אם הדפדפן חוסם — לא משנה את ה-state, לא רושם שגיאה.
  function tryPlay(){
    var p = audio.play();
    if(p && p.then){ p.then(function(){ /* הצליח */ }).catch(function(){ /* חסום — נמתין לאינטראקציה */ }); }
  }
  // עצירה "מערכתית" (כיפור, החלפת קובץ) — לא משנה את העדפת המשתמש.
  function systemPause(){ audio.pause(); }

  // לחיצה על כפתור הנגן — שינוי מפורש של העדפת המשתמש.
  btn.onclick = function(){
    // ביום כיפור — הכפתור עוצר אם משהו מתנגן, ולא מתחיל ניגון.
    if(window.vaadIsYomKippurNow && window.vaadIsYomKippurNow()){
      if(playing){ localStorage.setItem('vaad-music-wants','0'); systemPause(); }
      return;
    }
    if(playing){
      localStorage.setItem('vaad-music-wants','0');
      systemPause();
    } else {
      localStorage.setItem('vaad-music-wants','1');
      tryPlay();
    }
  };
  sel.onchange = function(){
    localStorage.setItem('vaad-music', sel.value);
    var wasPlaying = playing;
    audio.src = sel.value;
    if(wasPlaying) tryPlay();
  };
  // אייקון משקף את המצב האמיתי של ה-audio תמיד.
  audio.addEventListener('pause', function(){ playing=false; setIcon(); });
  audio.addEventListener('play',  function(){ playing=true;  setIcon(); });

  // === אוטו-פליי בטעינה (אם המשתמש לא ביקש שקט) ===
  var ykNow = function(){ return window.vaadIsYomKippurNow && window.vaadIsYomKippurNow(); };
  function autoStartIfWanted(){
    if(userWantsMusic() && !ykNow() && audio.paused){ tryPlay(); }
  }
  // ניסיון מיידי
  if(audio.readyState >= 2){ autoStartIfWanted(); }
  else { audio.addEventListener('loadedmetadata', autoStartIfWanted, {once:true}); }

  // גיבוי: דפדפן חסם autoplay → נתחיל ברגע שיש אינטראקציה כלשהי.
  // חשוב: bubble phase (לא capture), וגם דילוג על קליק שמקורו בכפתור המוזיקה —
  // כדי שלעולם לא נתערב בהחלטת המשתמש ללחוץ Pause.
  function onFirstInteraction(ev){
    // אם הקליק היה על כפתור המוזיקה — לא נתערב, נחכה לאינטראקציה אחרת.
    if(ev && ev.target && (ev.target===btn || (btn && btn.contains && btn.contains(ev.target)))){ return; }
    autoStartIfWanted();
    if(!audio.paused){
      ['click','touchstart','keydown'].forEach(function(eN){
        document.removeEventListener(eN, onFirstInteraction);
      });
    }
  }
  ['click','touchstart','keydown'].forEach(function(eN){
    document.addEventListener(eN, onFirstInteraction);
  });

  // חשיפה לכיפור: עצירה אוטומטית בלי לזכור.
  window.vaadStopMusic = systemPause;

  // ⏱ בדיקה דקתית: כיפור עוצר, יציאה מכיפור מחזירה (אם המשתמש לא ביקש שקט).
  setInterval(function(){
    if(ykNow()){
      if(!audio.paused) systemPause();
    } else {
      if(userWantsMusic() && audio.paused){ tryPlay(); }
    }
  }, 60000);
})();

/* ====================== הגל השקט — ניטור צבע אדום (Tzevaadom) ====================== */
(function(){
  // ערים שמעניינות אותנו (פיקוד העורף משתמש בכמה צורות כתיב).
  var MY_CITIES = [
    'מודיעין-מכבים-רעות',
    'מודיעין מכבים רעות',
    'מודיעין',
    'מכבים',
    'רעות'
  ];

  // 🏠 הנחיות מרחב מוגן ספציפיות לעפרוני 18 — תוצג גדול במסך באזעקה.
  // ניתן לערוך בקלות: שורה ראשית = ההנחייה החשובה ביותר; שניה = פירוט/אזהרה.
  var SHELTER_INFO = {
    primary:   'מרחב מוגן: קומה 1',
    secondary: 'עלו/רדו מיד למרחב המוגן',
    warning:   'התרחקו מחלונות וקירות חיצוניים'
  };

  function isAlertForUs(cities){
    if(!Array.isArray(cities) || !cities.length) return false;
    for(var i=0;i<cities.length;i++){
      var c = (cities[i]||'').toString();
      for(var j=0;j<MY_CITIES.length;j++){
        if(c.indexOf(MY_CITIES[j]) !== -1 || MY_CITIES[j].indexOf(c) !== -1) return true;
      }
    }
    return false;
  }

  // 🔊 סירנה גנרית באמצעות Web Audio API. צריך AudioContext פעיל (יוצרים בלחיצה הראשונה).
  var sirenAudioCtx = null;
  function ensureAudioCtx(){
    if(sirenAudioCtx) return sirenAudioCtx;
    try{
      var AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return null;
      sirenAudioCtx = new AC();
      return sirenAudioCtx;
    }catch(e){ return null; }
  }
  // מאתחל AudioContext בלחיצה הראשונה של המשתמש (בלחיצה על נגן המוזיקה למשל)
  document.addEventListener('click', function once(){
    ensureAudioCtx();
    try{ if(sirenAudioCtx && sirenAudioCtx.state==='suspended') sirenAudioCtx.resume(); }catch(e){}
    document.removeEventListener('click', once);
  }, true);

  function playSiren(durationSec){
    var ctx = ensureAudioCtx();
    if(!ctx) return;
    try{ if(ctx.state==='suspended') ctx.resume(); }catch(e){}
    try{
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = 'sine';
      var t = ctx.currentTime;
      // סירנה: תדר מתנדנד 700↔1000Hz כל חצי שנייה
      for(var i=0;i<durationSec;i+=1){
        osc.frequency.setValueAtTime(700, t+i);
        osc.frequency.linearRampToValueAtTime(1000, t+i+0.5);
        osc.frequency.linearRampToValueAtTime(700, t+i+1);
      }
      gain.gain.setValueAtTime(0.55, t);
      gain.gain.linearRampToValueAtTime(0.0, t+durationSec);
      osc.start(t);
      osc.stop(t+durationSec);
    }catch(e){}
  }

  var alertTimeout = null;
  function showRedAlert(cities){
    if(alertTimeout) clearTimeout(alertTimeout);
    var existing = document.getElementById('redAlertOverlay');
    if(existing) existing.remove();
    var ov = document.createElement('div');
    ov.id = 'redAlertOverlay';
    ov.className = 'alert-pulse fixed inset-0 z-[9999] flex flex-col items-center justify-center gap-6 p-8 text-center';
    ov.innerHTML =
      '<div class="alert-text-blink text-[10vw] font-black leading-none text-white">צבע אדום</div>'+
      '<div class="text-[4vw] font-black text-white">'+(cities && cities.length ? cities.join(' · ') : 'מודיעין-מכבים-רעות')+'</div>'+
      '<div class="text-[3.2vw] font-black text-white mt-1">מיד למרחב המוגן!</div>'+
      // 🏠 הנחיות מרחב מוגן ספציפיות לבניין — בולטות ובאזור ייחודי
      '<div class="mt-3 rounded-2xl bg-white/15 border-2 border-white/40 px-6 py-3 backdrop-blur-sm">'+
        '<div class="text-[2.3vw] font-black text-white leading-tight">'+SHELTER_INFO.primary+'</div>'+
        '<div class="text-[1.6vw] font-bold text-white/95 mt-1">'+SHELTER_INFO.secondary+'</div>'+
        '<div class="text-[1.4vw] font-semibold text-yellow-200 mt-2">⚠ '+SHELTER_INFO.warning+'</div>'+
      '</div>'+
      '<div class="text-[1.5vw] mt-3 font-semibold text-white/90">חכו 10 דקות לפני יציאה</div>'+
      '<div class="text-[1.1vw] mt-1 text-white/70">פיקוד העורף · 104</div>';
    document.body.appendChild(ov);
    playSiren(45); // 45 שניות סירנה
    // הסרת האזעקה אחרי 3 דקות
    alertTimeout = setTimeout(function(){
      var o = document.getElementById('redAlertOverlay'); if(o) o.remove();
    }, 3*60*1000);
  }

  // 🌐 חיבור WebSocket לתזעדום (Tzevaadom) — שירות קהילתי של התרעות.
  // אסטרטגיית חוסן:
  //   • Exponential backoff: 1s → 2s → 4s → 8s → 16s → 32s → 60s (תקרה).
  //   • איפוס המונה ל-1 שנייה ברגע חיבור מוצלח.
  //   • Heartbeat ping כל 30 שנ׳ — שומר על החיבור חי דרך NAT/firewall.
  //   • דחיית חיבור אם מתגלה ניתוק → סגירה מיידית ונסיון חדש.
  //   • מעקב מצב גלובלי: window.vaadAlertConnected (true/false).
  var ws = null, attempt = 0, heartbeatTimer = null, lastConnectedAt = 0;
  window.vaadAlertConnected = false;

  function backoffMs(){
    // 1s, 2s, 4s, 8s, 16s, 32s, 60s
    return Math.min(60000, 1000 * Math.pow(2, attempt));
  }
  function startHeartbeat(){
    clearInterval(heartbeatTimer);
    heartbeatTimer = setInterval(function(){
      if(ws && ws.readyState === WebSocket.OPEN){
        try { ws.send('{"type":"ping"}'); }
        catch(e){ try { ws.close(); } catch(_){} }
      }
    }, 30000);
  }
  function stopHeartbeat(){ clearInterval(heartbeatTimer); heartbeatTimer = null; }

  function connect(){
    try{
      ws = new WebSocket('wss://ws.tzevaadom.co.il/socket?platform=WEB');
      ws.onopen = function(){
        attempt = 0;
        lastConnectedAt = +new Date();
        window.vaadAlertConnected = true;
        startHeartbeat();
      };
      ws.onmessage = function(ev){
        try{
          var msg = JSON.parse(ev.data);
          var cities = (msg && msg.data && msg.data.cities) || msg.cities || null;
          var isAlert = (msg && (msg.type === 'ALERT' || msg.type === 'alert')) || cities;
          if(isAlert && cities && isAlertForUs(cities)){
            showRedAlert(cities.filter(function(c){
              return MY_CITIES.some(function(my){return c && (c.indexOf(my)!==-1 || my.indexOf(c)!==-1);});
            }));
          }
        }catch(e){ /* not JSON */ }
      };
      ws.onclose = function(){
        ws = null;
        window.vaadAlertConnected = false;
        stopHeartbeat();
        var delay = backoffMs();
        attempt++;
        setTimeout(connect, delay);
      };
      ws.onerror = function(){ try{ ws.close(); }catch(e){} };
    }catch(e){
      window.vaadAlertConnected = false;
      var delay = backoffMs();
      attempt++;
      setTimeout(connect, delay);
    }
  }
  connect();

  // 🟢 חשיפת מצב לדיבוג ידני: window.vaadAlertStatus()
  window.vaadAlertStatus = function(){
    return {
      connected: window.vaadAlertConnected,
      readyState: ws ? ws.readyState : 'no-ws',
      attemptCount: attempt,
      lastConnectedSecondsAgo: lastConnectedAt ? Math.round((new Date() - lastConnectedAt)/1000) : null
    };
  };

  // 🧪 לבדיקה ידנית: window.vaadTestAlert() — מציג אזעקה לדוגמה.
  window.vaadTestAlert = function(){ showRedAlert(['מודיעין-מכבים-רעות']); };
})();
</script>
