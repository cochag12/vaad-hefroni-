<style>
  html,body{height:100%}
  body{
    font-family:'Heebo',system-ui,sans-serif;color:#e2e8f0;background-color:#020410;
    background-image:
      radial-gradient(1100px 700px at 110% -10%, rgba(34,211,238,.09), transparent 60%),
      radial-gradient(1000px 700px at -10% 110%, rgba(99,102,241,.11), transparent 55%),
      radial-gradient(900px 600px at 50% 50%, rgba(56,189,248,.04), transparent 70%);
    background-attachment:fixed;
  }
  /* פאנל זכוכית הולוגרפי - אופקיות גבוהה (נראה תקין גם בטלוויזיות במצב Vivid) */
  .panel{
    background: linear-gradient(180deg, rgba(10,16,39,.92), rgba(5,8,24,.92));
    backdrop-filter: blur(14px) saturate(120%);
    -webkit-backdrop-filter: blur(14px) saturate(120%);
    border: 1px solid rgba(34,211,238,.22);
    box-shadow:
      0 0 20px -8px rgba(34,211,238,.25),
      inset 0 0 0 1px rgba(34,211,238,.04),
      inset 0 1px 0 rgba(255,255,255,.04);
  }
  .panel-strong{ border-color: rgba(34,211,238,.35); box-shadow: 0 0 24px -8px rgba(34,211,238,.35), inset 0 0 0 1px rgba(34,211,238,.08); }
  .glow-cyan{ box-shadow: 0 0 8px rgba(34,211,238,.55), 0 0 18px rgba(34,211,238,.25); }
  .text-glow{ text-shadow: 0 0 6px rgba(34,211,238,.35); }
  .title-grad{
    background: linear-gradient(180deg,#ffffff 0%, #c7d2fe 55%, #818cf8 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter: drop-shadow(0 0 10px rgba(129,140,248,.35));
  }
  .glass{background:rgba(15,23,42,.55);backdrop-filter:blur(12px) saturate(140%);-webkit-backdrop-filter:blur(12px) saturate(140%);border:1px solid rgba(34,211,238,.2)}
  @keyframes gradient-pan{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
  .gradient-pan{background-size:220% 220%;animation:gradient-pan 9s ease infinite}
  @keyframes float-slow{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  .float-slow{animation:float-slow 5s ease-in-out infinite}
  @keyframes marquee-x{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  .marquee-x{animation:marquee-x linear infinite}
  @keyframes scroll-up{from{transform:translateY(0)}to{transform:translateY(-50%)}}
  .scroll-up{animation:scroll-up linear infinite}
  @keyframes pulse-cyan{0%,100%{box-shadow:0 0 8px rgba(34,211,238,.6), 0 0 16px rgba(34,211,238,.3)}50%{box-shadow:0 0 14px rgba(34,211,238,.95), 0 0 32px rgba(34,211,238,.55)}}
  .pulse-cyan{animation:pulse-cyan 2.4s ease-in-out infinite}
  /* 🚨 אזעקה - צבע אדום: רקע פועם וחזק */
  @keyframes alert-pulse{0%,100%{background:rgba(220,38,38,0.97);box-shadow:inset 0 0 200px rgba(255,255,255,.15)}50%{background:rgba(153,27,27,0.97);box-shadow:inset 0 0 280px rgba(255,255,255,.25)}}
  .alert-pulse{animation:alert-pulse 0.85s ease-in-out infinite}
  @keyframes alert-text-blink{0%,100%{opacity:1;text-shadow:0 0 24px rgba(255,255,255,.95)}50%{opacity:.78;text-shadow:0 0 60px rgba(255,255,255,1)}}
  .alert-text-blink{animation:alert-text-blink 0.7s ease-in-out infinite}
  @keyframes circuit-shimmer{0%{opacity:.35}50%{opacity:.7}100%{opacity:.35}}
  .circuit-shimmer{animation:circuit-shimmer 6s ease-in-out infinite}
  .no-scrollbar::-webkit-scrollbar{display:none}
  .clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .clamp-bio{display:-webkit-box;-webkit-line-clamp:7;-webkit-box-orient:vertical;overflow:hidden}
  /* דפוס מעגלי-סייבר עדין לפינות */
  .cyber-corner::before, .cyber-corner::after{
    content:''; position:absolute; width:90px; height:90px; pointer-events:none;
    background-image:
      linear-gradient(rgba(34,211,238,.55), rgba(34,211,238,.55)),
      linear-gradient(rgba(34,211,238,.55), rgba(34,211,238,.55));
    background-repeat:no-repeat; background-size: 1px 60%, 60% 1px;
  }
  .cyber-corner::before{ top:-1px; right:-1px; background-position: right top, right top; }
  .cyber-corner::after { bottom:-1px; left:-1px; background-position: left bottom, left bottom; }
  @media (prefers-reduced-motion: reduce){.gradient-pan,.float-slow,.marquee-x,.scroll-up,.pulse-cyan,.circuit-shimmer,.bio-autoscroll{animation:none}}
  /* פאנל הביוגרפיה — אין פס גלילה ויזואלי (זה מסך תצוגה ללא אינטראקציה) */
  .figBio-wrap::-webkit-scrollbar{display:none}
  .figBio-wrap{scrollbar-width:none}
  .parshaSummaryWrap::-webkit-scrollbar{display:none}
  .parshaSummaryWrap{scrollbar-width:none}
  /* יחס גובה בעמודה הימנית: 40% לכללי הבית, 60% לכותרות נבחרות */
  @media (min-width: 700px){
    .rules-panel-grow{ flex: 2 2 0% !important; }
    .headlines-panel-grow{ flex: 3 3 0% !important; }
  }
  /* כללי הבית — fade בין כללים מתחלפים */
  .rule-display{ transition: opacity .7s ease-in-out, transform .7s ease-in-out; opacity:1; transform: translateY(0); }
  .rule-display.fading{ opacity:0; transform: translateY(8px); }
  /* תחזית שעתית — הדגשת שעת השיא */
  .peak-hour-cell{
    background: linear-gradient(180deg, rgba(250,204,21,.18), rgba(202,138,4,.08));
    border-radius: 6px;
    padding: 1px 2px;
  }
  /* כותרות נבחרות — הגבלת מספר שורות לכל כרטיס + "..." בסוף לכותרות ארוכות.
     מבטיח שתמיד 3 כרטיסים נכנסים גם בכותרות שמתפרסות על 4-5 שורות. */
  .headline-clamp{
    display: -webkit-box;
    -webkit-line-clamp: 3;
            line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  /* מצב לילה — עמעום של המסך בין 01:00 ל-05:00 (חיסכון בLED + עין נעימה בלילה).
     מוחל רק על #appRoot — כך שאם קופצת אזעקת צבע אדום, ה-overlay (שנוסף ישירות ל-body)
     נשאר בבהירות מלאה. */
  #appRoot{ transition: filter 8s ease-in-out, opacity 8s ease-in-out; }
  body.night-mode #appRoot{ filter: brightness(0.35) saturate(0.85); }
  /* גלילה אוטומטית של הביוגרפיה (פינג-פונג עם השהיות בקצוות) */
  @keyframes bio-pingpong{
    0%   { transform: translateY(0); }
    12%  { transform: translateY(0); }
    50%  { transform: translateY(var(--bio-max, 0px)); }
    62%  { transform: translateY(var(--bio-max, 0px)); }
    100% { transform: translateY(0); }
  }
  .bio-autoscroll{ animation: bio-pingpong linear infinite; }
</style>

/* ----- בית: כללי התנהגות — מבוסס תקנון "כללי התנהגות עפרוני 18" + כללים כלליים ----- */

  /* שעות מנוחה ורעש */
  "שעות מנוחה: 14:00–16:00 ו-22:00–07:00 — נא להימנע מרעש.",
  "אירועים ומסיבות — להודיע מראש לשכנים ולסיים עד 23:00.",

  /* חניה */

  "וישלח":"יעקב מתכונן לפגישה עם עשו אחיו — שולח לפניו מתנות, מחלק את מחנהו לשניים מחשש מלחמה, ומתפלל לה׳. בלילה הוא נאבק עם מלאך עד עלות השחר, מקבל את השם ישראל, ונפצע בכף ירכו. הפגישה עם עשו עוברת בשלום — הם מתחבקים ונפרדים בידידות. יעקב מגיע לשכם, ושכם בן חמור מענה את דינה בתו. שמעון ולוי הורגים את כל אנשי שכם בנקמה. יעקב עולה לבית אל, רחל מתה בלידת בנימין ונקברת בדרך לאפרת. ראובן נואף עם בלהה. הפרשה מסתיימת ברשימת תולדות עשו וצאצאיו באדום, כולל מלכי אדום שמלכו לפני שמלך מלך לבני ישראל.",
  "וישב":"יעקב מתיישב בארץ כנען. יוסף בן השבע עשרה, אהובו, מקנא עליו עשרת אחיו בשל כתונת הפסים שאביו עשה לו ובשל החלומות שחלם בהם הוא שולט עליהם. האחים זוממים נגדו, מורידים אותו לבור ומוכרים אותו לסוחרי ישמעאלים שמורידים אותו למצרים. הם מטבילים את הכתונת בדם ומראים אותה ליעקב, שמתאבל מרה. במצרים יוסף נמכר לפוטיפר ומצליח בכל עיסוקיו. אשת פוטיפר מנסה לפתות אותו, וכשהוא מסרב היא מאשימה אותו והוא נכלא. בכלא הוא פותר את חלומות שר המשקים ושר האופים — חלום שר המשקים מתגשם והוא חוזר לשרת את פרעה אך שוכח את יוסף. במקביל מספרת הפרשה את סיפור יהודה ותמר.",
  "מקץ":"שנתיים אחרי, פרעה חולם חלומות שאיש לא יודע לפותרם — שבע פרות שמנות שנבלעות בידי שבע רזות, ושבע שיבולים. שר המשקים נזכר ביוסף וממליץ עליו. יוסף מתפרש את החלומות: שבע שנות שובע יבואו ואחריהן שבע שנות רעב, וממליץ למנות איש חכם לאסוף תבואה. פרעה ממנה את יוסף למשנה למלך מצרים, נושא לו את אסנת לאישה. נולדים לו מנשה ואפרים. אחרי שנות השובע מתחיל הרעב, גם בכנען. יעקב שולח את עשרת בניו לקנות תבואה במצרים. יוסף מזהה אותם אך הם לא מזהים אותו. הוא מאשים אותם בריגול, כולא את שמעון, ודורש שיביאו את בנימין. יהודה מתחייב בפני אביו על שלום בנימין, והם חוזרים למצרים. הפרשה מסתיימת כשגביע יוסף נמצא בשק בנימין.",
  "ויגש":"יהודה ניגש אל יוסף ומתחנן בנאום נרגש לקחת אותו עבד במקום בנימין, כי יעקב לא יוכל לסבול את אובדן בנימין. יוסף לא יכול עוד להתאפק, מבקש שיוציאו את כל המצרים מהחדר, ומתוודה לאחיו: ״אני יוסף אחיכם!״ האחים נדהמים ומתביישים, אך יוסף מנחם אותם — לא הם שלחו אותו לכאן אלא ה׳, כדי להחיות את העם. הם שבים לכנען ומבשרים ליעקב הזקן שיוסף חי. יעקב מתאושש ויורד למצרים עם שבעים נפש. בדרך ה׳ מבטיח לו לא לפחד מהירידה. יוסף מתאחד עם אביו בגושן. יוסף מציג חמישה מאחיו לפרעה והם מתיישבים בגושן. הפרשה מסתיימת בכך שיוסף קונה את כל אדמת מצרים לפרעה בעבור לחם.",
  "ויחי":"יעקב חי במצרים שבע עשרה שנה. לפני מותו הוא משביע את יוסף להעלותו לקבורה בארץ ישראל. יעקב חולה, ויוסף מביא אליו את שני בניו אפרים ומנשה. יעקב מאמץ אותם כבנים ומברכם בשיכול ידיים — מעדיף את אפרים הצעיר על מנשה הבכור. יעקב מקבץ את שנים עשר בניו ונותן לכל אחד ברכה ייחודית הנושאת בקרבה גם נבואה לדורות. הוא מצוה אותם לקבור אותו במערת המכפלה. יעקב מת ויוסף, אחיו, וכל גדולי מצרים עולים לקבור אותו בארץ. אחרי המסע האחים חוששים שיוסף יתנקם בהם עכשיו שאבא איננו, אך יוסף מבטיחם שהוא לא יחזיר להם רעה. יוסף מת בגיל מאה ועשר, ומשביע את אחיו שיעלו את עצמותיו עמם בעת היציאה. כאן מסתיים ספר בראשית.",

  // ===== ספר שמות =====
  "שמות":"מתחיל ספר שמות. שבעים נפש מבית יעקב היו במצרים, פרו ורבו ומילאו את הארץ. מלך חדש קם, שלא ידע את יוסף, וגזר על בני ישראל עבדות קשה — בניית פיתום ורעמסס. כדי לעצור את ההתרבות גזר על המיילדות העבריות להמית את הזכרים, אך הן יראו את האלוהים ולא עשו כן. לבסוף ציוה פרעה להשליך כל זכר ליאור. אישה מבית לוי יולדת בן, צופנת אותו שלושה חודשים, ושמה אותו בתיבת גומא ביאור. בת פרעה רוחצת ומוצאת אותו, וקוראת לו משה. משה גדל בארמון, רואה איש מצרי מכה איש עברי והורגו, בורח למדין, נושא את ציפורה ועובד אצל יתרו חותנו. בסנה הבוער ה׳ מתגלה אליו ושולח אותו להוציא את העם ממצרים.",
  "וארא":"ה׳ אומר למשה: אני ה׳, נראיתי לאבות באל שדי אך בשמי הזה לא נודעתי להם. עכשיו אגאל אתכם בארבע לשונות גאולה — והוצאתי, והצלתי, וגאלתי, ולקחתי. משה ואהרן הולכים לפרעה, אהרן משליך מטה ומתפעל לתנין, אך גם חרטומי מצרים עושים כן. מתחילות שבע המכות הראשונות: דם — היאור והמים נהפכים לדם. צפרדע — שורצים בכל פינה. כינים. ערוב — חיות רעות. דבר במקנה המצרים. שחין על העם ועל הבהמה. ברד מעורב באש שמחריב את היבול. בכל מכה פרעה מבקש שיתפללו עליו, אך כשהמכה חולפת הוא מקשה את ליבו ומסרב לשלח את העם. הפרשה מסתיימת באמצע מכת ברד.",
  "בא":"שלוש המכות האחרונות: ארבה — אוכל כל ירק שנותר אחרי הברד. חושך — שלושה ימי חושך כבד במצרים, ובני ישראל היה אור במושבותם. ה׳ מצוה את משה על קידוש החודש, ועל קרבן הפסח: שה לבית, נשחט בארבעה עשר בניסן, צלי אש, ודמו נמרח על המשקופים. ובאישון הלילה — מכת בכורות. כל בכור במצרים מת — מבכור פרעה עד בכור השפחה. פרעה קם בלילה ושולח את העם בחפזון. בני ישראל יוצאים ממצרים — שש מאות אלף גברים מלבד טף — אחרי ארבע מאות ושלושים שנה. ה׳ מצוה על שמירת חג המצות, על קידוש הבכורות, ועל מצוות תפילין כזכר ליציאת מצרים.",
  "בשלח":"פרעה מתחרט ורודף אחרי בני ישראל. הם מגיעים לים סוף, מסביבם ההר, פרעה מאחור, והים לפנים. בני ישראל זועקים אל ה׳ ומתלוננים על משה. ה׳ מצוה להרים את המטה, ורוח קדים עזה מבקיעה את הים. בני ישראל עוברים בחרבה, ולאחריהם המים שבים על המצרים והרודפים טובעים. משה ובני ישראל שרים את שירת הים — ״אז ישיר משה״. מרים ונשים מצטרפות בתופים. במדבר העם צמא — וה׳ ממתיק את מי מרה. הם מגיעים לאילים, ומשם למדבר סין — שם מתחילים להתלונן על חוסר אוכל. ה׳ מוריד מן מהשמים בכל בוקר ושליו בערב, ומצוה לשמור שבת. במלחמת עמלק יהושע נלחם ומשה מרים ידיו על ההר.",
  "יתרו":"יתרו, חותן משה, שומע על הניסים ובא אליו במדבר עם ציפורה ושני בני משה. הוא מציע למשה לחלוק את משא השפיטה — למנות שרי אלפים, מאות, חמישים ועשרות. בני ישראל מגיעים להר סיני בחודש השלישי. ה׳ מתגלה במשך שלושה ימי הכנה — קולות, ברקים, ענן כבד והר עשן. ה׳ נותן את עשרת הדברות בקול גדול: אנכי ה׳ אלוהיך, לא יהיה לך אלהים אחרים, לא תישא, זכור את יום השבת, כבד את אביך ואת אמך, לא תרצח, לא תנאף, לא תגנב, לא תענה ברעך עד שקר, ולא תחמד. העם רואה את הקולות ונרתע, ומבקש ממשה שהוא ידבר עמו ולא ה׳. משה ניגש אל הערפל, וה׳ מצוה על איסור עשיית פסל ועל בניית מזבח אדמה.",
  "משפטים":"ה׳ נותן למשה משפטים — חוקים אזרחיים שמתבססים על עשרת הדברות. דיני עבד עברי שמשתחרר בשנה השביעית. דיני שומרי נפש — רוצח שוגג ומזיד, ערי מקלט. דיני נזיקין — שור שנגח, בור שנפתח, אש שיצאה, ארבעה אבות נזיקין. דיני שומרים — שומר חינם, שומר שכר, שואל. דיני מלוה — לא לקחת ריבית מעני, לא לעכב בגד עני בלילה. כיבוד הורים. מועדי השנה — פסח, שבועות, סוכות. שלוש פעמים בשנה תיראה את פני ה׳. הבטחת ה׳ להוביל את העם לארץ ולגרש שבעת העמים. בני ישראל קוראים: ״כל אשר דיבר ה׳ נעשה ונשמע״. משה כותב את הברית, מקריב קרבנות, ועולה להר עם יהושע — וכבוד ה׳ שוכן על ההר ארבעים יום וארבעים לילה.",
  "תרומה":"ה׳ מצוה את משה לקחת תרומה מבני ישראל — מכל איש שיתנדב — לבניית המשכן. רשימת חומרים: זהב, כסף, נחושת, תכלת, ארגמן, שני, שש, שמן, בשמים. ה׳ מורה את משה לעשות מקדש כתבנית שתראה ההר. תיאור מפורט של כלי המשכן: ארון הברית מעצי שיטים מצופה זהב לאחסון לוחות הברית, ועליו הכפורת והכרובים. שולחן לחם הפנים. המנורה מזהב טהור — קנה אחד עם שבעה נרות, גביעים, כפתורים ופרחים. יריעות המשכן עצמן — עשר יריעות מעורבות פתילי תכלת ארגמן ושני, וקרסי זהב לחבר ביניהן. עוד יריעות עזים. קרשי המשכן הרצויים על אדני כסף. המבנה מתואר בקפדנות רבה — סמל לכך שבדבר שעוסק בשכינה אין מקום לאלתור.",
  "תצוה":"ההמשך לציווי המשכן. ה׳ מצוה להעלות נר תמיד במנורה. ציווי על בגדי הכהונה לאהרן ובניו: לכוהן הדיוט — כתונת, מכנסים, אבנט ומגבעת. לכהן הגדול נוספים: אפוד עם שתי אבני שוהם הנושאות את שמות שבטי ישראל, חושן עם שתים עשרה אבני חן, מעיל תכלת עם פעמוני זהב, ציץ זהב לחזית המצח עם הכיתוב ״קודש לה׳״. טקס חניכת הכוהנים — שבעת ימי המילואים: הקרבת פר חטאת, איל לעולה, ואיל שני להסמכה. ה׳ מצוה גם על מזבח הקטורת מעצי שיטים, ועל קטורת בכל בוקר וערב. במזבח החיצוני מצויות עולת התמיד של בוקר וערב — סדר העבודה הקבועה. הפרשה היחידה בתורה (מסוף שמות לבמדבר) שאין בה שמו של משה.",
  "כי תשא":"ה׳ מצוה לפקוד את העם — כל אדם נותן מחצית השקל. תרומה זו מיועדת לאדני המשכן ולקרבנות הציבור. ציווי על הכיור לרחיצת ידי ורגלי הכוהנים. שמן המשחה הקדוש לקדש את כלי המשכן והכוהנים. בצלאל בן אורי משבט יהודה מתמנה לאומן הראשי. חזרה על מצוות השבת — ״אות היא ביני וביניכם לדורותיכם״. בעודו של משה על ההר לקבל את הלוחות, העם בורא עגל זהב ועובד לו, ואומר ״אלה אלוהיך ישראל״. ה׳ זועם וזעיר להשמיד את העם, אך משה מתפלל ומשנה את הגזרה. הוא יורד מההר, רואה את העגל, ושובר את הלוחות. הוא שורף את העגל ומשקה את העם, בני לוי הורגים את עובדי העגל. ה׳ מסכים לסלוח, משה רואה את ה׳ באחור — והלוחות השניים נחתמים.",
  "ויקהל":"משה מקהיל את כל עדת בני ישראל ומצוה אותם על שמירת שבת — ״ששת ימים תעשה מלאכה״. איסור הבערת אש בשבת. הוא מבקש מהעם תרומה לבניית המשכן. העם מביא בשמחה — תכשיטים, חוטים, עורות, עצים, שמן, בשמים — עד שיש מספיק ועוד. בצלאל ואהליאב, מלאי רוח חכמה, מתחילים לבנות. ה׳ נתן בהם את היכולת ללמד אחרים. הפרשה מתארת את ביצוע הציווי כפי שניתן בפרשות תרומה ותצוה: יריעות המשכן, הקרשים, הפרכת, המסך, ארון הברית, השולחן, המנורה מקשה אחת, מזבח הקטורת, שמן המשחה, מזבח העולה, הכיור והחצר. המבצעים מציגים שכל פרט נעשה כפי שצוה ה׳ — ״ויראה משה את כל המלאכה והנה עשו אתה כאשר צוה ה׳״.",
  "פקודי":"חישוב פקודי המשכן — מנין כסף, זהב ונחושת שהובאו לתרומה ומה נעשה בהם. בצלאל ואהליאב מסיימים את המלאכה. הם מביאים את כל החפצים אל משה: האהל ומכסיו, הארון והכפורת, השולחן, המנורה, מזבח הזהב, מזבח העולה, הכיור והחצר, ובגדי הכהונה לאהרן ובניו. משה רואה את הכל ומברך אותם. ה׳ מצוה את משה להקים את המשכן באחד בניסן — שנה מיציאת מצרים. משה מקים בעצמו את כל חלקי המשכן, מסדר כל כלי במקומו, ומקטיר קטורת על המזבח. בסוף — ענן מכסה את אוהל מועד וכבוד ה׳ ממלא את המשכן, עד כדי כך שמשה לא יכול היה להיכנס. כשהענן עולה — בני ישראל יוצאים למסעות. כאן מסתיים ספר שמות.",

  // ===== ספר ויקרא =====
  "ויקרא":"מתחיל ספר ויקרא — תורת הכוהנים. ה׳ קורא למשה מאוהל מועד ומלמד אותו את דיני הקרבנות. עולה — קרבן הנשרף כליל, מן הבקר הצאן או העוף. מנחה — קרבן מסולת, שמן ולבונה, חלקה למזבח וחלקה לכוהנים. שלמים — קרבן שמתחלק בין המזבח, הכוהן והבעלים. חטאת — קרבן על חטא שוגג, משתנה לפי מי החוטא (כהן גדול, סנהדרין, נשיא, יחיד). ה׳ מפרט את ההלכות במדויק: סמיכת ידי הבעלים על הקרבן, השחיטה, הזיית הדם, הפשטת העור. אשם — קרבן על חטאים מסוימים כגון מעילה, גזל, או כשיש ספק חטא. כל מערכת הקרבנות מציגה את האפשרות להתקרב לה׳ — להבדיל בין עבירות בשוגג ובמזיד, ולמצוא דרך לכפרה ולשיבה.",
  "צו":"ה׳ מצוה את משה ללמד את אהרן ובניו את חוקי הקרבנות מצדם של הכוהנים — איך לבצע את העבודה. עולה — אש המזבח אסור שתיכבה לעולם, ובכל בוקר מסירים את הדשן. מנחה — מקריבים קומץ למזבח, השאר נאכל בידי הכוהנים. חטאת ואשם — איך לאכול את חלקי הקרבן. שלמים — איך לחלק. איסור אכילת חלב ודם. לאחר מכן: שבעת ימי המילואים. משה מקדש את אהרן ואת בניו, מלביש להם את הבגדים, מושח אותם בשמן, ומקריב את קרבנות החנוכה. אהרן ובניו נשארים באוהל מועד שבעה ימים. הפרשה היא מעין ״ספר תפעול״ של הכוהן בעבודת המקדש — סדר מדויק שמלמד שעבודת ה׳ דורשת קביעות, ענווה וקדושה.",
  "שמיני":"ביום השמיני, אחרי שבעת ימי המילואים, אהרן מתחיל את עבודתו בפועל כהן גדול. הוא מקריב חטאת, עולה, מנחה ושלמים — לעצמו ולעם. אש יוצאת מלפני ה׳ ואוכלת את הקרבן על המזבח, והעם נופל על פניהם. נדב ואביהוא, שני בני אהרן, מקריבים אש זרה אשר לא צוה אותם — ואש יוצאת ושורפת אותם. אהרן שותק. ה׳ אוסר על הכוהנים לשתות יין לפני העבודה. הפרשה ממשיכה בדיני כשרות: חיות הטהורות והטמאות. בהמות — מעלות גרה ומפריסות פרסה. דגים — סנפיר וקשקשת. עופות טמאים מנויים בשם. שרצים. דיני טומאה וטהרה מבעלי חיים מתים. אזהרות לכוהן ולעם להבדיל בין הקודש לחול ובין הטמא לטהור.",
  "תזריע":"דיני טומאת יולדת. אישה שילדה זכר טמאה שבעה ימים והבן נימול ביום השמיני. ילדה בת — טמאה ארבעה עשר יום. בסיום ימי הטהרה מביאה קרבן חטאת ועולה (יורד מקרבן עולה לתור או יונה אם דלה). דיני נגעי צרעת — מחלת עור שהיא אות לחטא רוחני, בעיקר לשון הרע. שלוש סוגי שאת, ספחת ובהרת. הכהן בודק וקובע אם הנגע טהור או טמא — אם השער הפך לבן או יש מחיה בתוכו. הסגר של שבעה ימים לבדיקה חוזרת. נגעים שהופיעו על הראש או הזקן — נתק. נגעים על הקרחת. נגע בבגד — דיני בגד מצורע. דיני המצורע עצמו — לקרוע בגדיו, פרוע ראש, וצועק ״טמא טמא״, ויושב מחוץ למחנה — נסיון לעצור ולתקן.",
  "מצורע":"דיני טהרת המצורע אחרי שהתרפא. הכהן יוצא אל מחוץ למחנה, ואחרי טקס מורכב — שתי ציפורים חיות, עץ ארז, שני תולעת ואזוב — האחת נשחטת והשניה משולחת חופשי. המצורע מכבס בגדיו, מגלח כל שערותיו ורוחץ. ביום השביעי שוב מגלח את כל הגוף, ביום השמיני מביא קרבן שלוש בהמות (או דלה — שתי תורים ושתי כבשים). דיני נגע הצרעת בבית — אם הוא מופיע על קירות הבית, הכהן מסגירו שבעה ימים, ואם הנגע מתפשט מוציאים את האבנים הצרועות מהבית. אם חוזר — מבעירים את כל הבית. הפרשה ממשיכה בדיני זב וזבה — אנשים ונשים עם הפרשות לא נורמליות מהגוף שמטמאות, וצריך לטהר באמצעות שביעית ימים וקרבן.",
  "אחרי מות":"אחרי מות שני בני אהרן ה׳ מצוה את אהרן: לא ייכנס בכל עת אל הקודש. דיני יום הכיפורים — הקטורת, השעיר לעזאזל, וידוי החטאים. ביום הכיפורים הכהן הגדול בלבד נכנס לפני ולפנים. מקריב פר חטאת לעצמו, איל לעולה. מטיל גורלות על שני שעירים — אחד לה׳ ואחד לעזאזל. השעיר לעזאזל נשלח למדבר נושא את עוונות בני ישראל. הכהן מתוודה על כל חטאי העם. איסור שחיטת חולין במחנה — כל בהמה חייבת להיות מוקרבת באוהל מועד (חוק זמני למדבר). איסור אכילת דם. רשימת עריות אסורות לזיווג — איסורים שונים על קרובי משפחה, אישה ואחותה, נדה. אזהרה מפני מעשי כנען ומצרים.",
  "קדושים":"ה׳ מצוה: ״קדושים תהיו כי קדוש אני ה׳ אלוהיכם״. הפרשה מתמצתת רבות ממצוות התורה. כיבוד הורים, שבת, איסור עבודה זרה, פיגול, פאת השדה לעני, איסור גנבה ושבועת שקר, איסור עושק והלנת שכר שכיר, איסור קללת חרש ומכשול לפני עיוור. דין צדק במשפט — ״בצדק תשפט עמיתך״. איסור רכילות, שנאה, נקמה ונטירה. ״ואהבת לרעך כמוך״ — הכלל הגדול שבתורה. איסור הרבעת בהמות מסוגים שונים, כלאי זרעים, וכלאי בגדים (שעטנז). דיני ערלת הפרי — שלוש שנים לא אוכלים, רביעית קודש, חמישית אוכלים. איסור ניחוש, איסור גילוח קצוות הראש והזקן. כיבוד זקנים. אהבת הגר. אזהרה מפני העברת ילדים למולך ואיסור חמור על מעשים מתועבים.",
  "אמור":"דיני קדושת הכוהנים. כהן לא ייטמא למת אלא לקרובי משפחה. דיני מי האסור לכהן לקדש כאישה. כהן בעל מום אינו עובד. אסור לכוהנים לאכול קודש בטומאה. דיני אכילת תרומה. דין בעלי מומים בקרבן — אסור להקריב בהמה בעלת מום. ה׳ מצוה על המועדים: שבת — ״ששת ימים תיעשה מלאכה וביום השביעי שבת שבתון״. פסח — שבעה ימים מצות. ספירת העומר — שבע שבועות מהפסח. שבועות — בכורי הקציר. ראש השנה — זכרון תרועה. יום הכיפורים — עינוי וכפרה. סוכות — שבעה ימים בסוכות. הפרשה מסתיימת בציווי על שמן זית למאור, ועל לחם הפנים. בסוף — סיפור המקלל את שם ה׳, וסקילתו, ועקרון ״עין תחת עין״ — דין הנזיקין.",
  "בהר":"ה׳ מצוה את משה בהר סיני על דיני שמיטה — שש שנים תזרע ובשנה השביעית שבת לארץ. אסור לזרוע, לקצור או לאסוף, והיבול המעצמי הוא לעניים ולחיות. שנת היובל — אחרי שבע שמיטות (חמישים שנה), נשמע שופר ביום הכיפורים, ושדות שנמכרו חוזרים לבעליהם המקוריים והעבדים העברים יוצאים לחופשי. כיוון שהארץ של ה׳ — אדם אינו יכול למוכרה לצמיתות. דיני אונאה במכר. אזהרה מהסתמכות על עבודה זרה. דיני ״גואל״ — מי שאחיו ירד מנכסיו, יש לעזור לו ולא לקחת ממנו ריבית. דיני עבד עברי — לא יעבוד בעבודת פרך, ויצא בשנת היובל. הפרשה מצביעה על מבט חברתי-כלכלי לפי ה׳: רכוש זמני, איזון תקופתי, ושמירה על העני וההולך לאיבוד.",
  "בחקתי":"ה׳ אומר: אם תלכו בחוקותי תזכו בברכות — גשמי עיתם, יבול בארץ, שלום, ניצחון על אויבים, פריון. אם לא — תקבלו תוכחה: מחלות, רעב, חורבן, גלות, ופחד. רשימה ארוכה של ייסורים שיבואו אם העם לא יישמע. אך ה׳ מבטיח: גם בארצות אויביכם לא ימאסם — ה׳ לא יפר את בריתו לעולם. דיני ערכין — אם אדם נדר את שווי גופו או של אחר למקדש, מהו ערכו לפי גיל ומין. דיני בהמה שנודרים אותה, דיני בית ושדה. דיני קודש וחרם. דיני מעשר בהמה — כל עשירי קודש לה׳. הפרשה מסתיימת בכך שהתורה מסיימת את ספר ויקרא: ״אלה המצוות אשר צוה ה׳ את משה אל בני ישראל בהר סיני״.",

  // ===== ספר במדבר =====
  "במדבר":"ספר במדבר נפתח במפקד העם במדבר סיני — כל זכר מעשרים שנה ומעלה היוצא לצבא. כל שבט נמנה בנפרד, ומסתכמים בכשש מאות אלף לוחמים, חוץ מהלויים. שבט לוי מנוי בנפרד — כל זכר מבן חודש ומעלה — לעבודת המשכן. סדר חניית השבטים — ארבעה צדדים סביב למשכן, שלושה שבטים לכל צד, תחת דגלים: מזרח (יהודה), דרום (ראובן), מערב (אפרים), צפון (דן). הלויים חונים סביב למשכן עצמו — בני קהת מדרום, בני גרשון ממערב, בני מררי מצפון, ומשה ואהרן מזרח. כל משפחה לויית מקבלת תפקיד בנשיאת המשכן בעת המסע: בני קהת — הארון והכלים, בני גרשון — היריעות, בני מררי — הקרשים והאדנים. הלויים נלקחים תמורת בכורות בני ישראל.",
  "נשא":"המשך מפקד הלויים והקצאת התפקידים בנשיאת המשכן. דיני שילוח טמאים מן המחנה — מצורע, זב וטמא מת. דין גזל הגר — אם גנב ולא יש לו יורש, יחזיר לכוהן. סוטה — אישה שנחשדה בבגידה — סדר הבדיקה במים המאררים בידי הכהן. נזיר — אדם שמקבל על עצמו פרישות לתקופה: לא יין, לא תספורת, לא טומאת מת. הוא מקריב בסוף תקופתו קרבן ומגלח את שערו. ברכת הכוהנים — ״יברכך ה׳ וישמרך, יאר ה׳ פניו אליך ויחנך, יישא ה׳ פניו אליך וישם לך שלום״. חנוכת המזבח — שנים עשר נשיאי השבטים מקריבים קרבנות זהים בשנים עשר ימים רצופים. כל יום נשיא אחד מביא: קערת כסף, מזרק, כף זהב מלאה קטורת, בהמות לעולה ולשלמים. בסוף — סיכום מספרים.",
  "בהעלתך":"ה׳ מצוה את אהרן להדליק את שבעת נרות המנורה אל מול פני המנורה. טקס חניכת הלויים — נטהרים, נספרים, ומופרשים לעבודת המקדש. דין פסח שני — מי שהיה טמא או בדרך רחוקה בפסח הראשון, חוגגו חודש לאחר מכן. ענן ה׳ על המשכן ביום וכענן אש בלילה — אות למסעות. שתי חצוצרות כסף לקרוא את העם ולמסעות. בני ישראל יוצאים לדרך מהר סיני בעשרים באייר. במהלך המסע מתלוננים על חוסר בשר ועל המן. ה׳ זועם, ושולח שליו בכמות עצומה ומכה את המתאוננים בקברות התאווה. שבעים זקנים מתנבאים יחד עם משה, וכן אלדד ומידד הנביאים במחנה. הפרשה מסתיימת באירוע מרים שדיברה רעות על אחיה משה, נענשת בצרעת, ונרפאת אחרי שבעה ימים מחוץ למחנה.",
  "שלח־לך":"ה׳ מצוה את משה לשלוח שנים עשר מרגלים — נשיא אחד מכל שבט — לתור את ארץ כנען. הם הולכים ארבעים יום וחוזרים נושאים אשכול ענבים גדול, רימונים ותאנים. עשרה מהמרגלים מספרים: ״ערים בצורות גדולות, וענקים בארץ״ — שאי אפשר לכבוש. רק יהושע וכלב טוענים שאפשר ויש לבטוח בה׳. העם בוכה כל הלילה ורוצה לחזור למצרים. ה׳ זועם וגוזר שכל הדור הזה ימות במדבר — וייכנסו לארץ רק אחרי ארבעים שנה. עשרת המרגלים מתים במגפה. קבוצה מהעם מנסה לעלות לארץ למרות הציווי — ונכבשת. דיני נסכי קרבנות. דין חלה — תרומה מהבצק. דין שגגת הציבור. דין מקושש העצים בשבת — סקילתו. ציווי על מצוות ציצית — ״וזכרתם את כל מצוות ה׳ ועשיתם אותם״.",
  "קרח":"קרח בן יצהר משבט לוי, יחד עם דתן ואבירם משבט ראובן ועוד מאתיים וחמישים נשיאי עדה, מורד במשה ואהרן וטוען: ״כל העדה כולם קדושים — מדוע תתנשאו על קהל ה׳?״ משה מאתגר אותם: כל אחד יביא מחתה עם קטורת לפני ה׳ — ויראה ה׳ את מי בוחר. ה׳ מצוה את העם להתרחק מאוהלי המורדים. האדמה פוערת פיה ובולעת את קרח, דתן, אבירם וכל ביתם. אש יוצאת ושורפת את מאתיים וחמישים מקטירי הקטורת. למחרת העם מתלונן: ״אתם המיתם את עם ה׳״. מגפה פורצת — ארבעה עשר אלף ושבע מאות מתים. אהרן רץ עם מחתה ועוצר את המגפה. ה׳ מאשר את בחירת אהרן באמצעות המטה הפורח — מטה אהרן פורח שקדים, להוכיח שהוא הנבחר. ה׳ מצוה על מתנות הכוהנים והלויים.",
  "חקת":"ה׳ מצוה על פרה אדומה — דין טהרה ייחודי. שוחטים פרה אדומה תמימה, שורפים אותה כליל עם עץ ארז, אזוב ושני, ואוספים את האפר. האפר משמש לטהר אנשים שנטמאו במת — מזים עליהם מים שבהם אפר הפרה. הפרשה מקפיצה כמעט ארבעים שנה קדימה. מרים מתה בקדש. אין מים, והעם מתלונן. ה׳ מצוה את משה לדבר אל הסלע — אך משה מכה בו פעמיים. ה׳ זועם וגוזר שמשה ואהרן לא ייכנסו לארץ. אהרן מת על הר ההר ובנו אלעזר ממונה תחתיו. בני ישראל נלחמים במלך ערד הכנעני ומנצחים. נחשים שרפים מכים את המתלוננים, וה׳ מצוה לעשות נחש נחושת על נס — מי שמביט בו מבריא. מנצחים את סיחון מלך האמורי ואת עוג מלך הבשן וכובשים את עבר הירדן המזרחי.",
  "בלק":"בלק מלך מואב פוחד מבני ישראל ושולח לקרוא לבלעם בן בעור, קוסם מארץ ארם, לקלל את ישראל. ה׳ מצוה את בלעם לא ללכת, אך בלק שולח שוב — וה׳ מתיר לו ללכת אך מצוה לומר רק את שיציב לו. בלעם הולך, אתונו רואה מלאך עם חרב ושלוש פעמים נעצרת, בלעם מכה אותה — והיא מדברת. ה׳ פותח את עיני בלעם והוא רואה את המלאך. בלק לוקח את בלעם לשלושה הרים. שלוש פעמים בלעם מנסה לקלל ויוצא מפיו ברכה — ״מה טבו אהליך יעקב״, ״כי לא נחש ביעקב״, ונבואה על ״כוכב דורך מיעקב״. בלק זועם ובלעם הולך. בני ישראל זונים אחרי בנות מואב ועובדים לבעל פעור. ה׳ שולח מגפה. פינחס בן אלעזר הורג איש מישראל ומדינית בקבה אחת ועוצר את המגפה.",
  "פינחס":"ה׳ נותן לפינחס ״ברית שלום״ וכהונת עולם — בשכר קנאותו ועצירת המגפה. עם ישראל יוצא למלחמה במדינים בפקודת ה׳. מפקד שני של העם — כל גבר מבן עשרים — לקראת הכניסה לארץ. בנות צלפחד מבקשות נחלה בארץ — לאביהן לא היו בנים. ה׳ פוסק שיירשו. ה׳ מודיע למשה שיעלה להר ויאסף אל עמיו. משה מבקש מנהיג לעם, וה׳ ממנה את יהושע בן נון. ה׳ מצוה את משה לסמוך את ידיו עליו. סדר הקרבנות הקבועים: עולת התמיד — שני כבשים ביום. עולת השבת. עולת ראש חודש. קרבנות פסח שבעה ימים. קרבן שבועות. קרבנות ראש השנה — תרועה. יום הכיפורים — תענית וקרבן. שבעה ימי סוכות — שבעים פרים מתפחתים בכל יום. שמיני עצרת.",
  "מטות":"דיני נדרים ושבועות. אדם הנודר חייב בנדרו, אך אב יכול להפר נדר בתו, ובעל יכול להפר נדר אשתו ביום ששמע. מלחמת מדין — נקמה במדינים על שהחטיאו את ישראל בבעל פעור. הצבא יוצא בהנהגת פינחס, הורגים את חמשת מלכי מדין, את בלעם בן בעור, וכל זכר במדין. שובים נשים וטף. משה כועס שהותירו את הנשים שחטיאו, ומצוה להרוג אותן ואת הזכרים מהטף. דיני חלוקת השלל — מחצית ללוחמים, מחצית לעדה, ובעם הלוויים. שני שבטי ראובן וגד, ובהמשך חצי שבט מנשה, מבקשים להתנחל בעבר הירדן המזרחי בארץ הטובה למרעה. משה זועם שמא יחלישו את העם, אבל מתיר אחרי שמתחייבים לעבור חלוצים לקראת המלחמה על ארץ ישראל המערבית.",
  "מסעי":"רשימת ארבעים ושניים מסעי בני ישראל ממצרים עד ערבות מואב. ה׳ מצוה לגרש את כל יושבי הארץ, להשמיד את האלילים והבמות, ולהנחיל לעצמם. גבולות ארץ ישראל מפורטים — דרום, מערב, צפון ומזרח. שמות הנשיאים שיחלקו את הארץ — אלעזר הכהן, יהושע, ונציג מכל שבט. ה׳ מצוה לתת לויים ארבעים ושש ערים בנחלת השבטים, וביניהן שש ערי מקלט — שלוש מעבר הירדן ושלוש בארץ — מקלט לרוצח בשגגה. דיני רוצח בזדון ובשגגה — סדר הדין, צורת ההריגה, ויציאת הרוצח השוגג מעיר המקלט רק במות הכהן הגדול. דיני נחלת בנות צלפחד — מתחתנות בתוך שבטן כדי שלא תעבור הנחלה בין שבטים. כאן מסתיים ספר במדבר.",

  // ===== ספר דברים =====
  "דברים":"ספר דברים — נאומיו האחרונים של משה לבני ישראל בערבות מואב, חודש לפני מותו. הוא משחזר את המסע מהר חורב (סיני) — מינוי השופטים והשרים, סיפור המרגלים והעונש של ארבעים שנה במדבר. סיפור איך נשארו דור שלם במדבר עד שהזקנים מתו. ההוראה לא לעבור בארצות אדום, מואב ועמון — קרובי משפחה לישראל. ניצחון על סיחון מלך האמורי ועוג מלך הבשן וכיבוש עבר הירדן המזרחי, וחלוקת הארץ הזו לראובן, גד וחצי מנשה. בקשתו של משה להיכנס לארץ — וסירוב ה׳. ההוראה ליהושע להמשיך את ההובלה. משה פותח את ספר התורה לעם — לפני שיכנסו לארץ הוא רוצה לוודא שהם יודעים מה ה׳ דורש מהם.",
  "ואתחנן":"משה ממשיך את הנאום. הוא מתחנן לה׳ להיכנס לארץ אך נדחה. הוא מזהיר את העם לא להוסיף או לגרוע מהמצוות. הוא מזכיר את מעמד הר סיני — איך ה׳ דיבר מתוך האש, ואיך העם נרתע. הוא מפציר בעם לזכור ולהורות לבנים. ערי מקלט בעבר הירדן מוגדרות. משה חוזר על עשרת הדברות. ואז מופיעה תפילת ״שמע ישראל״ — ״שמע ישראל ה׳ אלוהינו ה׳ אחד״. ואהבת את ה׳ אלוהיך בכל לבבך ובכל נפשך ובכל מאודך. מצוות תפילין, מזוזה, ותלמוד תורה לבנים. משה מזהיר מההסחת דעת ועבודה זרה כאשר ייכנסו לארץ ויהיו עשירים. ה׳ הוא ה׳ אחד, ובו תדבק.",
  "עקב":"משה ממשיך: אם תשמעו למצוות, ה׳ יברך אתכם — פריון, שפע, ניצחון על אויבים. הוא מזכיר את הניסים במדבר — המן, הבגדים שלא בלו, השכינה. אזהרה לא לאמר ״כוחי ועוצם ידי עשו לי את החיל״ — ה׳ הוא הנותן. שוב מזכיר את חטא העגל ומסירותו של משה — איך התפלל ארבעים יום וארבעים לילה והציל את העם. שבירת הלוחות הראשונות ועלייתו השניה. אזהרה מפני אלילות — שריפת פסלים, אסור לקחת זהבם וכספם. ענוה: לא בצדקתכם תירשו את הארץ אלא בגלל רשעת הגויים והבטחת ה׳ לאבות. ארץ ישראל מתוארת — ארץ זבת חלב ודבש, ארץ זית שמן ודבש, ארץ ה׳ תמיד דורש. פרשת ״והיה אם שמוע״ — שכר ועונש לפי שמירת המצוות. אזהרה לא לעבוד אלהים אחרים.",
  "ראה":"משה אומר: ״ראה אנכי נותן לפניכם היום ברכה וקללה״. כשתבואו לארץ, הברכה על הר גריזים והקללה על הר עיבל. הוא מצוה להשמיד את כל מקומות העבודה הזרה בכנען. ציווי על ״מקום אשר יבחר ה׳״ — מקום אחד מרכזי שבו תעבד עבודת ה׳ (לימים — ירושלים). דין שחיטת חולין בכל מקום (לאחר הכניסה לארץ). איסור אכילת דם. נביא שקר ומסית — דינו מיתה. עיר הנדחת — עיר שכולה עובדים לאלילים — מחריבים אותה כליל. דיני כשרות שמורחבים — אסור אכילת שרצים, נבלה. דיני מעשרות — מעשר שני, ראשון, ועני. שמיטת כספים בשנה השביעית. דיני עבד עברי. בכור בהמה טהורה. שלושת הרגלים — פסח, שבועות, סוכות — שבהם עולים לרגל למקום אשר יבחר ה׳.",
  "שופטים":"דיני בית הדין: ״שופטים ושוטרים תיתן לך בכל שעריך״. איסור שוחד והטיית משפט. ״צדק צדק תרדוף״. דיני המלך — אם רוצים מלך, הוא חייב להיות מבני ישראל, לא ירבה לעצמו סוסים, נשים, כסף וזהב, וייכתוב לעצמו ספר תורה. דיני הכוהנים והלויים — מתנותיהם, וזכאותם לעלות לעבוד. נביא אמת ונביא שקר — איך לזהותם. שלוש ערי מקלט בארץ ישראל (בנוסף לשלוש בעבר הירדן). דיני עדות — שני עדים שקר נענשים במה שזממו לעשות לחבריהם. דיני מלחמה — הכהן המשוח מעודד את העם, ופטורים מן הצבא: מי שבנה בית חדש, נטע כרם, התארס לאישה, ופחדן. עיר שמוצרת — קוראים לה לשלום. עץ פרי לא יכרת. עגלה ערופה — בעיר הקרובה לחלל לא ידוע, מבצעים טקס לכפר.",
  "כי תצא":"דינים שונים. אשת יפת תואר — אם לוקח שבויה, ימתין חודש ויכבד את צערה. בכורת הבן השנאוי — חייב לרשת פי שניים. בן סורר ומורה — סדר הענישה. דין תליית בעלי דין מוות עד הערב. דיני השבת אבדה. אסור לראות שור או שה תועה ולעבור עליהם. שילוח הקן — שולחים את האם לפני לוקחים את הגוזלים. מעקה לגג. כלאי כרם, כלאי בהמה, שעטנז. ציצית. מוציא שם רע על אשתו. עונש על מעשי עריות. דיני הקהל ה׳ — מי לא נכנס. אסור להסגיר עבד שברח. ערבונות — לא לקחת רחים, לא להיכנס לבית לעבוט. שכיר — לא להלין שכרו. דיני גרושין. לקט שכחה ופאה. דין חליצה ויבום. תזכורת זכור מה עשה לך עמלק.",
  "כי תבוא":"מצוות הביכורים — כשתבוא לארץ, הבא את ראשית כל פרי האדמה לכוהן ותקרא הפסוקים ״ארמי אובד אבי״ — סיפור היציאה ממצרים. דיני וידוי מעשרות — הצהרה בסוף שלוש שנים שכל המעשרות נתנו כראוי. הצהרת ״היום הזה ה׳ אלוהיך מצוך לעשות את החוקים האלה״. בכניסה לארץ — להעמיד אבנים גדולות, לסוד אותן בסיד, ולכתוב עליהן את התורה. הקמת מזבח על הר עיבל. ברכות וקללות — שישה שבטים על הר גריזים לברך, ושישה על הר עיבל לקלל. הקריאה: ארור האיש אשר יעשה — שורה של חטאים. ואז התוכחה הגדולה — אם תשמעו, יבואו ברכות גדולות. ואם לא — קללות נוראות, מחלות, רעב, חרב, גלות, אכילת ילדים, חורבן, פיזור בגויים — הכל בסיבת מרידה בה׳.",
  "נצבים":"משה אומר: ״אתם נצבים היום כולכם לפני ה׳״ — מגדולכם ועד שואב המים, להיכנס בברית עם ה׳. הברית הזו לא רק עמכם, אלא גם עם הדורות הבאים. אזהרה: שלא יהיה בעם איש שלבו פונה אחרי אלהים אחרים — חוטא שכזה לא יסלח לו ה׳. בעקבות הברכות והקללות, ה׳ מבטיח: גם אם תוגלו לקצה השמים, אם תשובו אל ה׳ בכל לבבכם — הוא יקבץ אתכם וישיב אתכם לארץ, וירחיב את הברכה עליכם יותר מאשר על אבותיכם. המצוות לא נסתרות ולא רחוקות — ״כי קרוב אליך הדבר מאד, בפיך ובלבבך לעשותו״. משה מציג שתי דרכים: ״החיים והמות נתתי לפניך, הברכה והקללה, ובחרת בחיים״. בחירה חופשית — אבל ה׳ קורא לבחור נכון.",
  "וילך":"משה הולך ומדבר אל כל ישראל בגיל מאה ועשרים. הוא מודיע שלא יוכל יותר לצאת ולבוא, וה׳ אמר לו שלא יעבור את הירדן. יהושע ינהיג את העם. ה׳ ילך לפניהם, ישמיד את העמים — ובני ישראל יירשו את ארצם. ״חזקו ואמצו״ — אמר משה ליהושע לעיני כל העם. משה כותב את התורה, מוסר אותה לכוהנים ולזקנים, ומצוה על מצוות הקהל — אחת לשבע שנים, בחג הסוכות, יקרא המלך את התורה בפני כל העם — אנשים, נשים וטף. ה׳ מצוה את משה ויהושע להיכנס לאוהל מועד, מתגלה אליהם בעמוד ענן, ומודיע שהעם יזנה אחריו אלוהים אחרים — ועל כן מצוה לכתוב שירה (הפרשה הבאה) שתעיד נגדם.",
  "האזינו":"שירת האזינו — שירה גדולה שמשה מלמד את העם לפני מותו. ״האזינו השמים ואדברה ותשמע הארץ אמרי פי״. השירה מספרת על גדלות ה׳, על בחירת ישראל, על נתינת הארץ, על השומן שבו השמין ישראל ובעט. ה׳ זעם והסתיר פניו. אך לא ימחה את שמם — כי ידאג שאויביהם לא יתפארו. בסוף יקח נקמה על דם עבדיו, יכפר על ארצו ועל עמו. משה מסביר: ״כי לא דבר רק הוא מכם — כי הוא חייכם״. בסיום הפרשה ה׳ מצוה את משה לעלות אל הר נבו ולראות את הארץ מנגד — כי שם ימות, כפי שמת אהרן. סיבת הגזירה: על מי מריבה. משה לא ייכנס לארץ אך יראה אותה מהרים.",
  "וזאת הברכה":"הפרשה האחרונה בתורה. משה מברך לפני מותו את שנים עשר שבטי ישראל. כל ברכה מותאמת לאופי השבט: ראובן — שיחיה ולא ימות. יהודה — לקראת מלכותו. לוי — לקראת קדושתו. בנימין — ״ידיד ה׳ ישכון לבטח״. יוסף — ברכת ארצו ופוריותה. זבולון ויששכר — מסחר ולימוד. גד, דן, נפתלי, אשר — ברכות ייחודיות. משה עולה אל הר נבו, ה׳ מראהו את כל הארץ מצפון לדרום, ומבשרו שזו הארץ שהבטיח לאבות. משה מת על פי ה׳, ונקבר בעמק במואב — ואיש לא ידע את קבורתו. בני ישראל בוכים שלושים יום. יהושע מלא רוח חכמה כי משה סמך עליו. ״ולא קם נביא עוד בישראל כמשה אשר ידעו ה׳ פנים אל פנים״. כאן מסתיימת התורה.",

  // ===== פרשיות מחוברות (Hebcal לעיתים מחזיר שילובים בשנים לא מעוברות) =====
  "ויקהל־פקודי":"שתי פרשיות מסיום ספר שמות מאוחדות. ויקהל: משה מכנס את העם, חוזר על שמירת השבת, ומבקש תרומה למשכן. העם מביא בנדיבות עד שיש די והותר. בצלאל ואהליאב, מלאי רוח חכמה, מובילים את הבנייה — יריעות, ארון, שולחן, מנורה, מזבחות, חצר. פקודי: חישוב פקודי המשכן — כמה זהב, כסף ונחושת. בצלאל ואהליאב משלימים את הכל ומציגים לפני משה. ה׳ מצוה את משה להקים את המשכן באחד בניסן. משה מקים את המבנה, מסדר את הכלים, מקטיר קטורת, ומברך. ענן מכסה את אוהל מועד וכבוד ה׳ ממלא את המשכן עד שמשה לא יכול היה להיכנס. כשהענן עולה — בני ישראל יוצאים למסעות. סוף ספר שמות.",
  "תזריע־מצורע":"שתי פרשיות מסויימות מספר ויקרא. תזריע: דיני טומאת יולדת — שבעה ימים לזכר וארבעה עשר לנקבה, וקרבן בסיום ימי הטהרה. דיני נגעי צרעת — שאת, ספחת ובהרת — שהכהן בודק וקובע אם טהורים או טמאים, עם הסגרים ובדיקות חוזרות. מצורע: דיני טהרת המצורע אחרי שהבריא — טקס מורכב של שתי ציפורים, גילוח, כיבוס ומגלוח שני אחרי שבעה ימים, וקרבן ביום השמיני. דיני נגע צרעת בבית — אם הקיר מתחיל להתפורר נגעים, מסירים אבנים, ואם חוזר — מבעירים את כל הבית. דיני זב וזבה — אנשים ונשים עם הפרשות לא נורמליות, וטהרתם בשביעית ימים וקרבן. נושא מרכזי: טהרה בגוף ובסביבה, ושכפול במחנה דורש בידוד.",
  "אחרי מות־קדושים":"שתי פרשיות מספר ויקרא. אחרי מות: דיני יום הכיפורים — הכהן הגדול נכנס לקודש הקודשים, מקריב קרבנות חטאת, מטיל גורלות על שני שעירים — אחד לה׳ ואחד לעזאזל — וההוא לעזאזל נשלח למדבר נושא את עוונות ישראל. רשימת עריות אסורות. קדושים: הציווי ״קדושים תהיו״ — מצוות רבות שמרכזן בית פנימי וחברתי. כיבוד הורים, שבת, איסור עבודה זרה, פאת השדה לעני, איסור גנבה, איסור עושק והלנת שכר, ״לא תקלל חרש ולפני עיוור לא תיתן מכשול״, צדק במשפט, ״ואהבת לרעך כמוך״, איסור כלאיים, ערלת פרי, איסור ניחוש, ״מפני שיבה תקום״. סיכום מעשי לחיים מקודשים בכל תחומי החיים — בין אדם למקום, בין אדם לחברו, בין אדם לרכושו.",
  "בהר־בחקתי":"שתי פרשיות שמסיימות את ספר ויקרא. בהר: דיני שמיטה — שש שנים תזרע ובשביעית שבת לארץ. דיני יובל — אחרי חמישים שנה, שדות חוזרים לבעליהם, עבדים יוצאים. דיני אונאה, גואל, עזרה לעני, איסור ריבית. בחקותי: אם תשמעו למצוות — תזכו לגשמים, פריון, שלום וניצחון. אם לא — תוכחה ארוכה ונוראה: רעב, חורבן, גלות. ה׳ מבטיח לא להפר את בריתו לעולם, גם בארצות אויביכם לא ימאסם. דיני ערכין — שווי גוף לנדרי הקדש, דיני בית ושדה, ומעשר בהמה. הפרשה והספר מסתיימים: ״אלה המצוות אשר צוה ה׳ את משה אל בני ישראל בהר סיני״. מסר: מערכת חברתית-כלכלית של איזון בין רכוש לארץ, ועונש או שכר לפי שמירת מצוות.",
  "חקת־בלק":"שתי פרשיות מספר במדבר. חקת: פרה אדומה — שורפים כליל ואספר משמש לטהרת טומאת מת. מות מרים ואין מים. משה מכה בסלע במקום לדבר אליו — ה׳ גוזר שלא יכנס לארץ. מות אהרן. נחשים שרפים ונחש הנחושת. ניצחון על סיחון ועוג וכיבוש עבר הירדן. בלק: בלק מלך מואב מזמין את בלעם הקוסם לקלל את ישראל. בלעם הולך לאחר היסוס. אתונו רואה מלאך וסוטה מהדרך. הוא מנסה לקלל שלוש פעמים — ויוצאת ברכה: ״מה טבו אהליך יעקב״. בני ישראל זונים אחרי בנות מואב ועובדים בעל פעור. מגפה. פינחס דוקר את כזבי וזמרי, עוצר את המגפה ומקבל ברית כהונה.",
  "מטות־מסעי":"שתי הפרשיות החותמות את ספר במדבר. מטות: דיני נדרים — האב מפר את נדר בתו והבעל את אשתו. מלחמת מדין בהנהגת פינחס, הריגת בלעם בן בעור, שביית נשים וטף. משה כועס שמותירים את הנשים שהחטיאו. דיני חלוקת שלל. שבטי ראובן וגד ומחצי מנשה מקבלים נחלה בעבר הירדן המזרחי, בתנאי שיעברו חלוצים למלחמת ארץ ישראל. מסעי: רשימת ארבעים ושניים מסעות בני ישראל ממצרים. גבולות ארץ ישראל. הציווי לתת ללויים ארבעים ושש ערים, מהן שש ערי מקלט לרוצח בשגגה. דיני רוצח בזדון ושוגג. נחלת בנות צלפחד שמתחתנות בשבט אביהן. סוף ספר במדבר על שפת הירדן, ערב הכניסה לארץ.",
  "נצבים־וילך":"שתי פרשיות קצרות בסוף ספר דברים. נצבים: כל העם נצב לפני ה׳ — מגדולים עד שואב מים — לקבל ברית. הברית עם דורות הבאים. אזהרה מחטא חמור — ה׳ לא יסלח. הבטחה: גם אם תוגלו לקצה הארץ, אם תשובו אליו בלב שלם, ישיב אתכם. המצוות לא נסתרות — ״קרוב אליך הדבר מאד״. בחירה חופשית: ״החיים והמות נתתי לפניך... ובחרת בחיים״. וילך: משה בגיל מאה ועשרים, מודיע שלא יכנס לארץ. יהושע מתמנה תחתיו. משה כותב את התורה, מוסר לכוהנים ולזקנים. מצוות הקהל — אחת לשבע שנים בחג הסוכות יקרא המלך את התורה בפני כל העם. ה׳ מודיע שהעם יזנה — ועל כן יש לכתוב שירה לעדות נגדם."
};
function sunburstPath(cx, cy, outerR, innerR, spikes){
  var pts = '';
  for (var i = 0; i < spikes * 2; i++){
    var ang = (i / (spikes * 2)) * Math.PI * 2 - Math.PI / 2;
    var r = (i % 2 === 0) ? outerR : innerR;
    var x = (cx + r * Math.cos(ang)).toFixed(2);
    var y = (cy + r * Math.sin(ang)).toFixed(2);
    pts += (i === 0 ? 'M' : 'L') + x + ' ' + y + ' ';
  }
  return pts + 'Z';
}

      '<defs><radialGradient id="sg" cx="40%" cy="35%" r="65%">'+

      '</radialGradient></defs>'+
      '<path d="'+p+'" fill="url(#sgs)"/>'+

    '</svg>';

      '<g fill="#60A5FA">'+

  }
  // ענן בלבד (לערפל וכו') — לבן יותר ובהיר יותר

}

/* ===== המרה לגימטריה — תאריך עברי מסורתי (ט״ז סיון תשפ״ו) ===== */
function gematria(num){
  // מקרים מיוחדים — 15/16 כדי לא ליצור צירופי שם השם.
  if(num===15) return 'ט״ו';
  if(num===16) return 'ט״ז';
  var letters=[[400,'ת'],[300,'ש'],[200,'ר'],[100,'ק'],
               [90,'צ'],[80,'פ'],[70,'ע'],[60,'ס'],[50,'נ'],[40,'מ'],[30,'ל'],[20,'כ'],
               [10,'י'],[9,'ט'],[8,'ח'],[7,'ז'],[6,'ו'],[5,'ה'],[4,'ד'],[3,'ג'],[2,'ב'],[1,'א']];
  var result='';
  for(var i=0;i<letters.length;i++){
    while(num>=letters[i][0]){ result+=letters[i][1]; num-=letters[i][0]; }
  }
  if(result.length===1) return result + '׳';                      // גרש על אות בודדת
  return result.slice(0,-1) + '״' + result.slice(-1);             // גרשיים לפני האות האחרונה
}
function hebrewDate(d){
  try{
    // יום ושנה — מספרים שננציג בגימטריה
    var parts = new Intl.DateTimeFormat('en-u-ca-hebrew', {day:'numeric', year:'numeric'}).formatToParts(d);
    var day=0, year=0;
    parts.forEach(function(p){
      if(p.type==='day')  day  = parseInt(p.value,10);
      if(p.type==='year') year = parseInt(p.value,10);
    });
    // שם החודש בעברית — מהפורמטר הישראלי. מסיר את ה-ב' (כי "ב + חודש" זה צורת התאריך באמירה).
    var heParts = new Intl.DateTimeFormat('he-IL-u-ca-hebrew', {month:'long'}).formatToParts(d);
    var heMonth = '';
    heParts.forEach(function(p){ if(p.type==='month') heMonth = p.value; });
    heMonth = heMonth.replace(/^ב/,'').replace(/סיוון/,'סיון').replace(/חשוון/,'חשון');
    return gematria(day) + ' ' + heMonth + ' ' + gematria(year % 1000);
  } catch(e){ return ''; }
}

/* ===== מצב לילה — עמעום אוטומטי בין 01:00 ל-05:00 ===== */
function updateNightMode(d){
  var h = d.getHours();
  var isNight = h >= 1 && h < 5;
  document.body.classList.toggle('night-mode', isNight);
}

function tickClock(){
  var n=new Date();
  document.getElementById('clock').textContent=n.toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  var gregorian = n.toLocaleDateString('he-IL',{weekday:'long',day:'2-digit',month:'2-digit',year:'numeric'});
  var hebrew = hebrewDate(n);
  document.getElementById('date').textContent = hebrew ? (gregorian + ' · ' + hebrew) : gregorian;
  updateNightMode(n);
}
setInterval(tickClock,1000);tickClock();

/* ====================== HOUSE RULES — מתחלפים כל 21 שניות בfade + התאמת גופן דינמית ====================== */
(function(){

  if(!el) return;

  // אותו עיקרון כמו ה"כותרות נבחרות" — הסטרימר לפעמים מוסיף שורות בגלל RTL/Hebrew rendering.
  function fitRuleText(){
    var parent = el.parentElement;
    if(!parent) return;
    el.style.fontSize = ''; // איפוס לגודל ברירת מחדל (מהמחלקה sm:text-lg = 18px)
    // הקטנה הדרגתית מ-18 ל-11px עד שהכלל נכנס
    var sizes = [18, 17, 16, 15, 14, 13, 12, 11];
    for(var i=0; i<sizes.length; i++){
      if(parent.scrollHeight <= parent.clientHeight + 2) return; // נכנס
      el.style.fontSize = sizes[i] + 'px';
    }
  }

  function showFirst(){
    el.textContent = HOUSE_RULES[0];
    idx = 1;
    setTimeout(fitRuleText, 50); // עיכוב קטן עד שהדפדפן יצייר
  }
  function showNext(){
    el.classList.add('fading');
    setTimeout(function(){
      el.textContent = HOUSE_RULES[idx];
      idx = (idx + 1) % HOUSE_RULES.length;
      el.classList.remove('fading');
      setTimeout(fitRuleText, 50);
    }, FADE_MS);
  }
  showFirst();
  setInterval(showNext, SWITCH_MS);
})();

/* ====================== SELECTED HEADLINES — עמוד של 3 כותרות מתחלף כל 5 שניות ====================== */
(function(){
  var pageEl = document.getElementById('headlinePage');
  if(!pageEl) return;
  var SOURCES=[
    {name:'וואלה',    badge:'bg-rose-400 text-rose-950',     url:'https://rss.walla.co.il/feed/1', take:4},
    {name:'ספורט',    badge:'bg-emerald-400 text-emerald-950',url:'https://www.ynet.co.il/Integration/StoryRss3.xml', take:4},
    {name:'גלובס',    badge:'bg-amber-300 text-amber-950',   url:'https://www.globes.co.il/webservice/rss/rssfeeder.asmx/FeederNode?iID=585', take:4},
  ];
  var items = [];
  var startIdx = 0;       // אינדקס הפריט הראשון בעמוד הנוכחי
  var shownCount = 0;     // כמה פריטים מוצגים בפועל בעמוד הנוכחי (1-3)
  var SWITCH_MS = 15000;  // החלפת עמוד כל 15 שניות
  var FADE_MS   = 700;

  // קיצוץ חכם — מנסה לעצור בסימן פיסוק (./,/:/!/?/-) או בגבול מילה.
  // מבטיח שהכותרת לא נחתכת באמצע משפט.
  function truncateTitle(text, maxChars){
    if(text.length <= maxChars) return text;
    var cut = text.substring(0, maxChars);
    // עדיפות 1: סימן פיסוק "סוף משפט" — . ! ? בסוף מילה
    var sentenceEnd = Math.max(cut.lastIndexOf('. '), cut.lastIndexOf('! '), cut.lastIndexOf('? '));
    if(sentenceEnd > maxChars * 0.5) return cut.substring(0, sentenceEnd + 1);
    // עדיפות 2: נקודתיים, מקף, פסיק — סימני "המתנה"
    var pause = Math.max(cut.lastIndexOf(':'), cut.lastIndexOf(' - '), cut.lastIndexOf(' – '), cut.lastIndexOf(','));
    if(pause > maxChars * 0.5) return cut.substring(0, pause + 1) + '…';
    // עדיפות 3: גבול מילה (רווח)
    var lastSpace = cut.lastIndexOf(' ');
    if(lastSpace > maxChars * 0.6) cut = cut.substring(0, lastSpace);
    return cut + '…';
  }
  // לוגיקה: תמיד 3 כרטיסים, כל אחד עם max-height קבוע ע"פ גובה הפאנל.
  // קיצוץ ידני נוסף לכותרת ארוכה. עובד גם על RTL/Hebrew בסטרימר.
  function renderCardsHTML(start, count, maxChars, cardMaxHeight){
    var slice = items.slice(start, start + count);
    var heightStyle = cardMaxHeight ? ' style="max-height:'+cardMaxHeight+'px;overflow:hidden;"' : '';
    return slice.map(function(it){
      var truncated = truncateTitle(it.title, maxChars);
      return '<div class="flex items-start gap-2 rounded-2xl border border-brand-400/15 bg-brand-400/5 px-3 py-2"'+heightStyle+'>'+
        '<span class="shrink-0 rounded-full '+it.badge+' px-2 py-0.5 text-[11px] font-extrabold">'+it.source+'</span>'+
        '<span class="headline-clamp text-[12.5px] font-medium leading-snug text-slate-100">'+truncated+'</span>'+
      '</div>';
    }).join('');
  }
  function applyFontSize(px){
    var spans = pageEl.querySelectorAll('span.headline-clamp');
    spans.forEach(function(s){ s.style.fontSize = px + 'px'; });
  }
  function fits(){ return pageEl.scrollHeight <= pageEl.clientHeight + 2; }

  function renderWindow(){
    if(!items.length) return;
    var maxN = Math.min(3, items.length);
    // אסטרטגיה: עדיף להציג פחות כותרות, אבל כל אחת **מלאה**.
    // לא משתמשים ב-maxChars (לא מקצצים) — רק קובעים כמה כרטיסים להציג.
    var FULL = 9999; // אינסוף — לא לקצץ
    var attempts = [
      {count: maxN, maxChars: FULL},        // 3 כותרות מלאות
      {count: Math.min(2,maxN), maxChars: FULL}, // 2 כותרות מלאות
      {count: 1, maxChars: FULL}            // כותרת אחת מלאה
    ];
    for(var c=0; c<attempts.length; c++){
      var a = attempts[c];
      var n = a.count;
      var panelH = pageEl.clientHeight;
      var gapTotal = (n-1) * 8;
      var maxCardH = Math.max(40, Math.floor((panelH - gapTotal) / n) - 2);
      pageEl.innerHTML = renderCardsHTML(startIdx, n, a.maxChars, maxCardH);
      if(fits()){ shownCount = n; return; }
    }
    // קצה אחרון: כותרת אחת + הקטנת פונט (במציאות לעולם לא יגיע לכאן)
    shownCount = 1;
    pageEl.innerHTML = renderCardsHTML(startIdx, 1, FULL, null);
    var fontSteps = [12, 11.5, 11, 10.5, 10];
    for(var f=0; f<fontSteps.length; f++){
      if(fits()) return;
      applyFontSize(fontSteps[f]);
    }
  }
  function showNextPage(){
    if(!items.length) return;
    pageEl.classList.add('fading');
    setTimeout(function(){
      startIdx = (startIdx + (shownCount || 1)) % items.length;
      renderWindow();
      pageEl.classList.remove('fading');
    }, FADE_MS);
  }
  function renderPage(){ renderWindow(); } // alias תאימות

  function fetchFeed(src){
    return fetch('https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent(src.url))
      .then(function(r){return r.json()})
      .then(function(d){
        if(!d||d.status!=='ok'||!d.items) return [];
        return d.items.slice(0,src.take).map(function(it){
          return { source:src.name, badge:src.badge, title:(it.title||'').trim() };
        }).filter(function(x){return x.title;});
      })
      .catch(function(){return [];});
  }
  function load(){
    Promise.all(SOURCES.map(fetchFeed)).then(function(arrs){
      var mixed=[]; var max=Math.max.apply(null, arrs.map(function(a){return a.length;}));
      for(var i=0;i<max;i++){ arrs.forEach(function(a){ if(a[i]) mixed.push(a[i]); }); }
      if(mixed.length){
        items = mixed;
        if(startIdx >= items.length) startIdx = 0;
        renderWindow();
      }
    });
  }
  load();
  setInterval(load, 20*60*1000);       // ריענון תוכן כל 20 דקות
  setInterval(showNextPage, SWITCH_MS); // החלפת עמוד כל 5 שניות
})();

  var figSection = document.getElementById('figName').closest('section');

  // אם הטקסט נכנס בקופסה — אין אנימציה. אם ארוך — פינג-פונג: גלילה למטה, השהיה, חזרה למעלה.
  // קצב יעד ~14 px/s (קצת איטי יותר מ"כותרות נבחרות" כדי שיהיה נוח לקריאה ארוכה).
  function setupBioAutoScroll(){
    var bio = document.getElementById('figBio');
    var wrap = bio && bio.parentElement;
    if(!bio || !wrap) return;
    // איפוס לפני חישוב מחדש
    bio.classList.remove('bio-autoscroll');
    bio.style.removeProperty('--bio-max');
    bio.style.removeProperty('animation-duration');
    // נחכה לפריסה לפני שמודדים
    requestAnimationFrame(function(){
      var overflow = bio.scrollHeight - wrap.clientHeight;
      if(overflow <= 4) return; // נכנס בלי גלילה
      // משך הסיבוב: 40% למטה + 20% השהיה + 40% למעלה. אם 40% = overflow/14 שניות,
      // אז סיבוב מלא = overflow/(14*0.4) ≈ overflow/5.6. מינימום 28 שניות.
      var dur = Math.max(28, Math.round(overflow / 5.6));
      bio.style.setProperty('--bio-max', '-'+overflow+'px');
      bio.style.animationDuration = dur + 's';
      bio.classList.add('bio-autoscroll');
    });
  }
  // חשיפה גלובלית — שגם עדכון ויקיפדיה האסינכרוני יוכל להפעיל מחדש

        '<div class="shrink-0 mt-auto pt-1 flex flex-col items-center gap-1">'+

  function isSilentNow(){ return !!figSection.querySelector('[data-silent="1"]'); }

    // (כמו רמב״ן — exintro לבד היה מחזיר 139 תווים בלבד).

function renderHourlyForecast(j){
  if(!j.hourly || !j.hourly.time) return;
  var el = document.getElementById('weatherHourly');
  if(!el) return;
  // מצא את האינדקס של השעה הנוכחית בנתוני hourly
  var now = new Date();
  var currentHour = now.getHours();
  var startIdx = -1;
  for(var i=0; i<j.hourly.time.length; i++){
    var t = new Date(j.hourly.time[i]);
    if(t.getHours() === currentHour && t.getDate() === now.getDate()){
      startIdx = i + 1; // השעה הבאה
      break;
    }
  }
  if(startIdx < 0) startIdx = 0;
  // 8 שעות קדימה
  var hours = [];
  for(var k=0; k<8 && (startIdx + k) < j.hourly.time.length; k++){
    var idx = startIdx + k;
    var d = new Date(j.hourly.time[idx]);
    hours.push({
      hour: d.getHours(),
      temp: Math.round(j.hourly.temperature_2m[idx]),
      wcode: j.hourly.weather_code[idx]
    });
  }
  if(!hours.length) return;
  // מצא את שעת השיא בטווח שמוצג
  var peakIdx = 0;
  for(var p=1; p<hours.length; p++){
    if(hours[p].temp > hours[peakIdx].temp) peakIdx = p;
  }
  var peak = hours[peakIdx];
  var firstTemp = hours[0].temp;
  var trendLabel = '';
  if(peak.temp > firstTemp + 1){
    trendLabel = '↗ עולה לשיא ' + peak.temp + '° ב-' + String(peak.hour).padStart(2,'0') + ':00';
  } else if(peak.temp < firstTemp - 1){
    trendLabel = '↘ יורד מ-' + firstTemp + '° ל-' + hours[hours.length-1].temp + '°';
  } else {
    trendLabel = '~ יציב סביב ' + peak.temp + '°';
  }
  // רינדור 6 שעות (במקום 8) — חוסך מקום משמעותי על הסטרימר
  var hours6 = hours.slice(0, 6);
  var peakIdx6 = 0;
  for(var p2=1; p2<hours6.length; p2++){
    if(hours6[p2].temp > hours6[peakIdx6].temp) peakIdx6 = p2;
  }
  var cardsHTML = hours6.map(function(h, i){
    var isPeak = (i === peakIdx6);
    return '<div class="rounded'+(isPeak ? ' peak-hour-cell' : '')+'">'+
      '<div class="text-[8px] '+(isPeak ? 'text-white/95 font-bold' : 'text-white/65')+'">'+String(h.hour).padStart(2,'0')+'</div>'+
      '<div class="text-[11px] font-bold '+(isPeak ? 'text-amber-300' : '')+' tabular-nums leading-tight">'+h.temp+'°</div>'+
    '</div>';
  }).join('');
  // ללא sparkline וללא תווית — מינימליסטי, רק 6 שעות
  el.innerHTML =
    '<div class="grid grid-cols-6 gap-1 text-center">'+cardsHTML+'</div>';
}

(function(){
  var ticker=document.getElementById('ticker');
  function badge(t,cls){return '<span class="rounded-full px-2 py-0.5 text-[11px] font-extrabold '+cls+'">'+t+'</span>';}
  function render(titles){
    if(!titles.length)return;
    var loop=titles.concat(titles);
    ticker.innerHTML=loop.map(function(t){
      return '<span class="flex items-center gap-2.5 text-base font-semibold" dir="rtl"><span class="size-2 shrink-0 rounded-full bg-brand-400 glow-cyan"></span><span class="text-slate-100">'+t+'</span><span class="px-2 text-brand-400/50">•</span></span>';
    }).join('');
    requestAnimationFrame(function(){
      var one=ticker.scrollWidth/2;ticker.style.animationDuration=Math.max(30,Math.round(one/40))+'s';
    });
  }
  function fetchTitles(feed,n){
    var u='https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent(feed);
    return fetch(u).then(function(r){return r.json()}).then(function(d){
      if(!d||d.status!=='ok'||!d.items)return[];
      return d.items.slice(0,n).map(function(it){return (it.title||'').trim()}).filter(Boolean);
    }).catch(function(){return[]});
  }
  function loadNews(){
    fetchTitles('https://www.ynet.co.il/Integration/StoryRss2.xml',14).then(function(titles){
      if(titles.length)render(titles);
    });
  }
  render(['מתעדכן…']);
  loadNews();
  setInterval(loadNews,600000);
})();

/* ====================== MUSIC (קבצי MP3 מקומיים — אפס צריכת נתונים) ====================== */
/* HTML5 <audio> מנגן בלולאה אינסופית. ברירת מחדל: מנגן אוטומטית.
   נעצר רק אם המשתמש לחץ Pause במפורש, או ביום כיפור (אוטומטי).
   ב-kiosk.bat יש פלאג --autoplay-policy=no-user-gesture-required כדי לעקוף חסימת autoplay. */
(function(){
  var sel = document.getElementById('musicSel');
  var audio = document.getElementById('bgAudio');
  var btn = document.getElementById('musicBtn');
  var pi = document.getElementById('playIcon');
  var pa = document.getElementById('pauseIcon');
  // אם יש רק קובץ אחד — מסתירים את ה-select
  if(MUSIC.length <= 1){ sel.style.display = 'none'; } else { sel.style.display = ''; }
  MUSIC.forEach(function(t){ var o=document.createElement('option'); o.value=t.file; o.textContent=t.name; sel.appendChild(o); });
  var saved = localStorage.getItem('vaad-music') || MUSIC[0].file;
  if(!MUSIC.some(function(m){return m.file===saved;})){ saved = MUSIC[0].file; }
  sel.value = saved;
  audio.src = saved;
  audio.volume = 0.55;
  var playing = false;
  function setIcon(){ pi.classList.toggle('hidden', playing); pa.classList.toggle('hidden', !playing); }
  // userWants: האם המשתמש מעוניין במוזיקה? null = לא הוגדר עדיין (ברירת מחדל = כן, מנגן).
  function userWantsMusic(){ return localStorage.getItem('vaad-music-wants') !== '0'; }
  // ניסיון ניגון "שקט": אם הדפדפן חוסם — לא משנה את ה-state, לא רושם שגיאה.
  function tryPlay(){
    var p = audio.play();
    if(p && p.then){ p.then(function(){ /* הצליח */ }).catch(function(){ /* חסום — נמתין לאינטראקציה */ }); }
  }
  // עצירה "מערכתית" (כיפור, החלפת קובץ) — לא משנה את העדפת המשתמש.
  function systemPause(){ audio.pause(); }

  // לחיצה על כפתור הנגן — שינוי מפורש של העדפת המשתמש.
  btn.onclick = function(){
    // ביום כיפור — הכפתור עוצר אם משהו מתנגן, ולא מתחיל ניגון.
    if(window.vaadIsYomKippurNow && window.vaadIsYomKippurNow()){
      if(playing){ localStorage.setItem('vaad-music-wants','0'); systemPause(); }
      return;
    }
    if(playing){
      localStorage.setItem('vaad-music-wants','0');
      systemPause();
    } else {
      localStorage.setItem('vaad-music-wants','1');
      tryPlay();
    }
  };
  sel.onchange = function(){
    localStorage.setItem('vaad-music', sel.value);
    var wasPlaying = playing;
    audio.src = sel.value;
    if(wasPlaying) tryPlay();
  };
  // אייקון משקף את המצב האמיתי של ה-audio תמיד.
  audio.addEventListener('pause', function(){ playing=false; setIcon(); });
  audio.addEventListener('play',  function(){ playing=true;  setIcon(); });

  // === אוטו-פליי בטעינה (אם המשתמש לא ביקש שקט) ===
  var ykNow = function(){ return window.vaadIsYomKippurNow && window.vaadIsYomKippurNow(); };
  function autoStartIfWanted(){
    if(userWantsMusic() && !ykNow() && audio.paused){ tryPlay(); }
  }
  // ניסיון מיידי
  if(audio.readyState >= 2){ autoStartIfWanted(); }
  else { audio.addEventListener('loadedmetadata', autoStartIfWanted, {once:true}); }

  // גיבוי: דפדפן חסם autoplay → נתחיל ברגע שיש אינטראקציה כלשהי.
  // חשוב: bubble phase (לא capture), וגם דילוג על קליק שמקורו בכפתור המוזיקה —
  // כדי שלעולם לא נתערב בהחלטת המשתמש ללחוץ Pause.
  function onFirstInteraction(ev){
    // אם הקליק היה על כפתור המוזיקה — לא נתערב, נחכה לאינטראקציה אחרת.
    if(ev && ev.target && (ev.target===btn || (btn && btn.contains && btn.contains(ev.target)))){ return; }
    autoStartIfWanted();
    if(!audio.paused){
      ['click','touchstart','keydown'].forEach(function(eN){
        document.removeEventListener(eN, onFirstInteraction);
      });
    }
  }
  ['click','touchstart','keydown'].forEach(function(eN){
    document.addEventListener(eN, onFirstInteraction);
  });

  // חשיפה לכיפור: עצירה אוטומטית בלי לזכור.
  window.vaadStopMusic = systemPause;

  // ⏱ בדיקה דקתית: כיפור עוצר, יציאה מכיפור מחזירה (אם המשתמש לא ביקש שקט).
  setInterval(function(){
    if(ykNow()){
      if(!audio.paused) systemPause();
    } else {
      if(userWantsMusic() && audio.paused){ tryPlay(); }
    }
  }, 60000);
})();

/* ====================== הגל השקט — ניטור צבע אדום (Tzevaadom) ====================== */
(function(){
  // ערים שמעניינות אותנו (פיקוד העורף משתמש בכמה צורות כתיב).
  var MY_CITIES = [
    'מודיעין-מכבים-רעות',
    'מודיעין מכבים רעות',
    'מודיעין',
    'מכבים',
    'רעות'
  ];

  // 🏠 הנחיות מרחב מוגן ספציפיות לעפרוני 18 — תוצג גדול במסך באזעקה.
  // ניתן לערוך בקלות: שורה ראשית = ההנחייה החשובה ביותר; שניה = פירוט/אזהרה.
  var SHELTER_INFO = {
    primary:   'מרחב מוגן: קומה 1',
    secondary: 'עלו/רדו מיד למרחב המוגן',
    warning:   'התרחקו מחלונות וקירות חיצוניים'
  };

  function isAlertForUs(cities){
    if(!Array.isArray(cities) || !cities.length) return false;
    for(var i=0;i<cities.length;i++){
      var c = (cities[i]||'').toString();
      for(var j=0;j<MY_CITIES.length;j++){
        if(c.indexOf(MY_CITIES[j]) !== -1 || MY_CITIES[j].indexOf(c) !== -1) return true;
      }
    }
    return false;
  }

  // 🔊 סירנה גנרית באמצעות Web Audio API. צריך AudioContext פעיל (יוצרים בלחיצה הראשונה).
  var sirenAudioCtx = null;
  function ensureAudioCtx(){
    if(sirenAudioCtx) return sirenAudioCtx;
    try{
      var AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return null;
      sirenAudioCtx = new AC();
      return sirenAudioCtx;
    }catch(e){ return null; }
  }
  // מאתחל AudioContext בלחיצה הראשונה של המשתמש (בלחיצה על נגן המוזיקה למשל)
  document.addEventListener('click', function once(){
    ensureAudioCtx();
    try{ if(sirenAudioCtx && sirenAudioCtx.state==='suspended') sirenAudioCtx.resume(); }catch(e){}
    document.removeEventListener('click', once);
  }, true);

  function playSiren(durationSec){
    var ctx = ensureAudioCtx();
    if(!ctx) return;
    try{ if(ctx.state==='suspended') ctx.resume(); }catch(e){}
    try{
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = 'sine';
      var t = ctx.currentTime;
      // סירנה: תדר מתנדנד 700↔1000Hz כל חצי שנייה
      for(var i=0;i<durationSec;i+=1){
        osc.frequency.setValueAtTime(700, t+i);
        osc.frequency.linearRampToValueAtTime(1000, t+i+0.5);
        osc.frequency.linearRampToValueAtTime(700, t+i+1);
      }
      gain.gain.setValueAtTime(0.55, t);
      gain.gain.linearRampToValueAtTime(0.0, t+durationSec);
      osc.start(t);
      osc.stop(t+durationSec);
    }catch(e){}
  }

  var alertTimeout = null;
  function showRedAlert(cities){
    if(alertTimeout) clearTimeout(alertTimeout);
    var existing = document.getElementById('redAlertOverlay');
    if(existing) existing.remove();
    var ov = document.createElement('div');
    ov.id = 'redAlertOverlay';
    ov.className = 'alert-pulse fixed inset-0 z-[9999] flex flex-col items-center justify-center gap-6 p-8 text-center';
    ov.innerHTML =
      '<div class="alert-text-blink text-[10vw] font-black leading-none text-white">צבע אדום</div>'+
      '<div class="text-[4vw] font-black text-white">'+(cities && cities.length ? cities.join(' · ') : 'מודיעין-מכבים-רעות')+'</div>'+
      '<div class="text-[3.2vw] font-black text-white mt-1">מיד למרחב המוגן!</div>'+
      // 🏠 הנחיות מרחב מוגן ספציפיות לבניין — בולטות ובאזור ייחודי
      '<div class="mt-3 rounded-2xl bg-white/15 border-2 border-white/40 px-6 py-3 backdrop-blur-sm">'+
        '<div class="text-[2.3vw] font-black text-white leading-tight">'+SHELTER_INFO.primary+'</div>'+
        '<div class="text-[1.6vw] font-bold text-white/95 mt-1">'+SHELTER_INFO.secondary+'</div>'+
        '<div class="text-[1.4vw] font-semibold text-yellow-200 mt-2">⚠ '+SHELTER_INFO.warning+'</div>'+
      '</div>'+
      '<div class="text-[1.5vw] mt-3 font-semibold text-white/90">חכו 10 דקות לפני יציאה</div>'+
      '<div class="text-[1.1vw] mt-1 text-white/70">פיקוד העורף · 104</div>';
    document.body.appendChild(ov);
    playSiren(45); // 45 שניות סירנה
    // הסרת האזעקה אחרי 3 דקות
    alertTimeout = setTimeout(function(){
      var o = document.getElementById('redAlertOverlay'); if(o) o.remove();
    }, 3*60*1000);
  }

  // 🌐 חיבור WebSocket לתזעדום (Tzevaadom) — שירות קהילתי של התרעות.
  // אסטרטגיית חוסן:
  //   • Exponential backoff: 1s → 2s → 4s → 8s → 16s → 32s → 60s (תקרה).
  //   • איפוס המונה ל-1 שנייה ברגע חיבור מוצלח.
  //   • Heartbeat ping כל 30 שנ׳ — שומר על החיבור חי דרך NAT/firewall.
  //   • דחיית חיבור אם מתגלה ניתוק → סגירה מיידית ונסיון חדש.
  //   • מעקב מצב גלובלי: window.vaadAlertConnected (true/false).
  var ws = null, attempt = 0, heartbeatTimer = null, lastConnectedAt = 0;
  window.vaadAlertConnected = false;

  function backoffMs(){
    // 1s, 2s, 4s, 8s, 16s, 32s, 60s
    return Math.min(60000, 1000 * Math.pow(2, attempt));
  }
  function startHeartbeat(){
    clearInterval(heartbeatTimer);
    heartbeatTimer = setInterval(function(){
      if(ws && ws.readyState === WebSocket.OPEN){
        try { ws.send('{"type":"ping"}'); }
        catch(e){ try { ws.close(); } catch(_){} }
      }
    }, 30000);
  }
  function stopHeartbeat(){ clearInterval(heartbeatTimer); heartbeatTimer = null; }

  function connect(){
    try{
      ws = new WebSocket('wss://ws.tzevaadom.co.il/socket?platform=WEB');
      ws.onopen = function(){
        attempt = 0;
        lastConnectedAt = +new Date();
        window.vaadAlertConnected = true;
        startHeartbeat();
      };
      ws.onmessage = function(ev){
        try{
          var msg = JSON.parse(ev.data);
          var cities = (msg && msg.data && msg.data.cities) || msg.cities || null;
          var isAlert = (msg && (msg.type === 'ALERT' || msg.type === 'alert')) || cities;
          if(isAlert && cities && isAlertForUs(cities)){
            showRedAlert(cities.filter(function(c){
              return MY_CITIES.some(function(my){return c && (c.indexOf(my)!==-1 || my.indexOf(c)!==-1);});
            }));
          }
        }catch(e){ /* not JSON */ }
      };
      ws.onclose = function(){
        ws = null;
        window.vaadAlertConnected = false;
        stopHeartbeat();
        var delay = backoffMs();
        attempt++;
        setTimeout(connect, delay);
      };
      ws.onerror = function(){ try{ ws.close(); }catch(e){} };
    }catch(e){
      window.vaadAlertConnected = false;
      var delay = backoffMs();
      attempt++;
      setTimeout(connect, delay);
    }
  }
  connect();

  // 🟢 חשיפת מצב לדיבוג ידני: window.vaadAlertStatus()
  window.vaadAlertStatus = function(){
    return {
      connected: window.vaadAlertConnected,
      readyState: ws ? ws.readyState : 'no-ws',
      attemptCount: attempt,
      lastConnectedSecondsAgo: lastConnectedAt ? Math.round((new Date() - lastConnectedAt)/1000) : null
    };
  };

  // 🧪 לבדיקה ידנית: window.vaadTestAlert() — מציג אזעקה לדוגמה.
  window.vaadTestAlert = function(){ showRedAlert(['מודיעין-מכבים-רעות']); };
})();
</script>
